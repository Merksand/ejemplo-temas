ldren":[],"payload":{"tag":"h4","lines":"177,178"}},{"content":"La velocidad cambia de forma uniforme en el tiempo","children":[],"payload":{"tag":"h4","lines":"178,179"}},{"content":"La aceleraci&#xf3;n no cambia en ning&#xfa;n momento","children":[],"payload":{"tag":"h4","lines":"179,180"}},{"content":"Es el tipo de movimiento m&#xe1;s importante en f&#xed;sica cl&#xe1;sica","children":[],"payload":{"tag":"h4","lines":"180,181"}}],"payload":{"tag":"h3","lines":"176,177"}},{"content":"Las 4 ecuaciones cinem&#xe1;ticas del MRUV","children":[{"content":"Ecuaci&#xf3;n 1 &#x2014; Velocidad en funci&#xf3;n del tiempo","children":[{"content":"v = v&#x2080; + a &#xb7; t","children":[],"payload":{"tag":"h5","lines":"185,186"}},{"content":"Relaciona: velocidad final, velocidad inicial, aceleraci&#xf3;n y tiempo","children":[],"payload":{"tag":"h5","lines":"186,187"}},{"content":"Despejables: v, v&#x2080;, a, t","children":[],"payload":{"tag":"h5","lines":"187,188"}}],"payload":{"tag":"h4","lines":"184,185"}},{"content":"Ecuaci&#xf3;n 2 &#x2014; Posici&#xf3;n en funci&#xf3;n del tiempo","children":[{"content":"x = x&#x2080; + v&#x2080; &#xb7; t + &#xbd; &#xb7; a &#xb7; t&#xb2;","children":[],"payload":{"tag":"h5","lines":"190,191"}},{"content":"Relaciona: posici&#xf3;n final, posici&#xf3;n inicial, velocidad inicial, aceleraci&#xf3;n y tiempo","children":[],"payload":{"tag":"h5","lines":"191,192"}},{"content":"Es la m&#xe1;s completa pero tiene t&#xb2; &#x2192; puede requerir resolver una cuadr&#xe1;tica","children":[],"payload":{"tag":"h5","lines":"192,193"}}],"payload":{"tag":"h4","lines":"189,190"}},{"content":"Ecuaci&#xf3;n 3 &#x2014; Velocidad en funci&#xf3;n de la posici&#xf3;n (sin tiempo)","children":[{"content":"v&#xb2; = v&#x2080;&#xb2; + 2 &#xb7; a &#xb7; (x - x&#x2080;)","children":[],"payload":{"tag":"h5","lines":"195,196"}},{"content":"Muy &#xfa;til cuando no se conoce el tiempo","children":[],"payload":{"tag":"h5","lines":"196,197"}},{"content":"Relaciona: velocidad final, velocidad inicial, aceleraci&#xf3;n y desplazamiento","children":[],"payload":{"tag":"h5","lines":"197,198"}}],"payload":{"tag":"h4","lines":"194,195"}},{"content":"Ecuaci&#xf3;n 4 &#x2014; Posici&#xf3;n usando velocidad promedio","children":[{"content":"x = x&#x2080; + ((v&#x2080; + v) / 2) &#xb7; t","children":[],"payload":{"tag":"h5","lines":"200,201"}},{"content":"Solo v&#xe1;lida si la aceleraci&#xf3;n es constante","children":[],"payload":{"tag":"h5","lines":"201,202"}},{"content":"La velocidad promedio en MRUV es exactamente (v&#x2080; + v) / 2","children":[],"payload":{"tag":"h5","lines":"202,203"}}],"payload":{"tag":"h4","lines":"199,200"}}],"payload":{"tag":"h3","lines":"182,183"}},{"content":"&#xbf;Qu&#xe9; ecuaci&#xf3;n usar?","children":[{"content":"Identificar qu&#xe9; variables se conocen y cu&#xe1;l se busca","children":[],"payload":{"tag":"h4","lines":"205,206"}},{"content":"Elegir la ecuaci&#xf3;n que tenga solo una inc&#xf3;gnita","children":[],"payload":{"tag":"h4","lines":"206,207"}},{"content":"Si se conoce: v&#x2080;, a, t &#x2192; usar Ec. 1 para v, Ec. 2 para x","children":[],"payload":{"tag":"h4","lines":"207,208"}},{"content":"Si se conoce: v&#x2080;, v, a &#x2192; usar Ec. 3 para x, Ec. 4 para t","children":[],"payload":{"tag":"h4","lines":"208,209"}},{"content":"Si se conoce: v&#x2080;, a, x &#x2192; usar Ec. 3 para v, Ec. 2 para t","children":[],"payload":{"tag":"h4","lines":"209,210"}}],"payload":{"tag":"h3","lines":"204,205"}},{"content":"Gr&#xe1;ficas del MRUV","children":[{"content":"x vs t &#x2192; par&#xe1;bola (abre hacia arriba si a &gt; 0, hacia abajo si a &lt; 0)","children":[],"payload":{"tag":"h4","lines":"212,213"}},{"content":"v vs t &#x2192; l&#xed;nea recta con pendiente = a","children":[],"payload":{"tag":"h4","lines":"213,214"}},{"content":"a vs t &#x2192; l&#xed;nea horizontal en a = constante","children":[],"payload":{"tag":"h4","lines":"214,215"}}],"payload":{"tag":"h3","lines":"211,212"}},{"content":"Ejemplos de MRUV","children":[{"content":"Un auto que acelera desde el sem&#xe1;foro","children":[],"payload":{"tag":"h4","lines":"217,218"}},{"content":"Una piedra cayendo al vac&#xed;o","children":[],"payload":{"tag":"h4","lines":"218,219"}},{"content":"Un proyectil en la direcci&#xf3;n vertical","children":[],"payload":{"tag":"h4","lines":"219,220"}},{"content":"Un tren frenando al llegar a la estaci&#xf3;n","children":[],"payload":{"tag":"h4","lines":"220,221"}}],"payload":{"tag":"h3","lines":"216,217"}}],"payload":{"tag":"h2","lines":"174,175"}},{"content":"Ca&#xed;da Libre","children":[{"content":"Definici&#xf3;n","children":[{"content":"Movimiento de un objeto bajo la influencia exclusiva de la gravedad","children":[],"payload":{"tag":"h4","lines":"227,228"}},{"content":"Se desprecia completamente la resistencia del aire","children":[],"payload":{"tag":"h4","lines":"228,229"}},{"content":"Es un MRUV con aceleraci&#xf3;n constante hacia abajo: g &#x2248; 9.8 m/s&#xb2;","children":[],"payload":{"tag":"h4","lines":"229,230"}},{"content":"Todos los objetos caen con la misma aceleraci&#xf3;n independientemente de su masa (Galileo)","children":[],"payload":{"tag":"h4","lines":"230,231"}}],"payload":{"tag":"h3","lines":"226,227"}},{"content":"Convenci&#xf3;n de signos en ca&#xed;da libre","children":[{"content":"Se toma el eje y positivo hacia arriba (convenci&#xf3;n m&#xe1;s com&#xfa;n)","children":[],"payload":{"tag":"h4","lines":"233,234"}},{"content":"La aceleraci&#xf3;n gravitacional es negativa: a = -g = -9.8 m/s&#xb2;","children":[],"payload":{"tag":"h4","lines":"234,235"}},{"content":"La velocidad inicial puede ser positiva (lanzado hacia arriba), negativa (lanzado hacia abajo) o cero (soltado)","children":[],"payload":{"tag":"h4","lines":"235,236"}}],"payload":{"tag":"h3","lines":"232,233"}},{"content":"Ecuaciones de ca&#xed;da libre (eje y positivo hacia arriba)","children":[{"content":"v = v&#x2080; - g &#xb7; t","children":[],"payload":{"tag":"h4","lines":"238,239"}},{"content":"y = y&#x2080; + v&#x2080; &#xb7; t - &#xbd; &#xb7; g &#xb7; t&#xb2;","children":[],"payload":{"tag":"h4","lines":"239,240"}},{"content":"v&#xb2; = v&#x2080;&#xb2; - 2 &#xb7; g &#xb7; (y - y&#x2080;)","children":[],"payload":{"tag":"h4","lines":"240,241"}}],"payload":{"tag":"h3","lines":"237,238"}},{"content":"Caso 1 &#x2014; Objeto soltado desde el reposo (v&#x2080; = 0)","children":[{"content":"v = -g &#xb7; t (velocidad negativa &#x2192; cae hacia abajo)","children":[],"payload":{"tag":"h4","lines":"243,244"}},{"content":"y = y&#x2080; - &#xbd; &#xb7; g &#xb7; t&#xb2;","children":[],"payload":{"tag":"h4","lines":"244,245"}},{"content":"Tiempo de ca&#xed;da desde altura h: t = &#x221a;(2h/g)","children":[],"payload":{"tag":"h4","lines":"245,246"}},{"content":"Velocidad al llegar al suelo: v = -&#x221a;(2gh)","children":[],"payload":{"tag":"h4","lines":"246,247"}}],"payload":{"tag":"h3","lines":"242,243"}},{"content":"Caso 2 &#x2014; Objeto lanzado hacia arriba (v&#x2080; &gt; 0)","children":[{"content":"Sube hasta la altura m&#xe1;xima donde v = 0","children":[],"payload":{"tag":"h4","lines":"249,250"}},{"content":"Tiempo para llegar a la altura m&#xe1;xima: t_max = v&#x2080; / g","children":[],"payload":{"tag":"h4","lines":"250,251"}},{"content":"Altura m&#xe1;xima sobre el punto de lanzamiento: h_max = v&#x2080;&#xb2; / (2g)","children":[],"payload":{"tag":"h4","lines":"251,252"}},{"content":"Tiempo total de vuelo (si cae al mismo nivel): t_total = 2 &#xb7; v&#x2080; / g","children":[],"payload":{"tag":"h4","lines":"252,253"}},{"content":"Al regresar al punto de lanzamiento: la rapidez es igual a v&#x2080; (misma magnitud, sentido contrario)","children":[],"payload":{"tag":"h4","lines":"253,254"}}],"payload":{"tag":"h3","lines":"248,249"}},{"content":"Caso 3 &#x2014; Objeto lanzado hacia abajo (v&#x2080; &lt; 0)","children":[{"content":"Parte con velocidad hacia abajo y sigue acelerando en ese sentido","children":[],"payload":{"tag":"h4","lines":"256,257"}},{"content":"v = v&#x2080; - g &#xb7; t (ambas negativas &#x2192; magnitud aumenta)","children":[],"payload":{"tag":"h4","lines":"257,258"}}],"payload":{"tag":"h3","lines":"255,256"}},{"content":"Valor de g en distintos lugares","children":[{"content":"Superficie terrestre (nivel del mar): g &#x2248; 9.8 m/s&#xb2;","children":[],"payload":{"tag":"h4","lines":"260,261"}},{"content":"Polo Norte: g &#x2248; 9.832 m/s&#xb2; (mayor por achatamiento polar)","children":[],"payload":{"tag":"h4","lines":"261,262"}},{"content":"Ecuador: g &#x2248; 9.780 m/s&#xb2; (menor por la rotaci&#xf3;n y mayor radio)","children":[],"payload":{"tag":"h4","lines":"262,263"}},{"content":"Luna: g &#x2248; 1.62 m/s&#xb2;","children":[],"payload":{"tag":"h4","lines":"263,264"}},{"content":"Marte: g &#x2248; 3.72 m/s&#xb2;","children":[],"payload":{"tag":"h4","lines":"264,265"}},{"content":"J&#xfa;piter: g &#x2248; 24.8 m/s&#xb2;","children":[],"payload":{"tag":"h4","lines":"265,266"}}],"payload":{"tag":"h3","lines":"259,260"}}],"payload":{"tag":"h2","lines":"224,225"}},{"content":"Tiro Vertical","children":[{"content":"Definici&#xf3;n","children":[{"content":"Un objeto se lanza verticalmente con velocidad inicial distinta de cero","children":[],"payload":{"tag":"h4","lines":"272,273"}},{"content":"Es un MRUV con a = -g en el eje vertical","children":[],"payload":{"tag":"h4","lines":"273,274"}},{"content":"Caso particular de la ca&#xed;da libre con v&#x2080; &#x2260; 0","children":[],"payload":{"tag":"h4","lines":"274,275"}}],"payload":{"tag":"h3","lines":"271,272"}},{"content":"An&#xe1;lisis completo del tiro vertical hacia arriba","children":[{"content":"Fase de subida","children":[{"content":"La velocidad disminuye desde v&#x2080; hasta 0","children":[],"payload":{"tag":"h5","lines":"279,280"}},{"content":"La aceleraci&#xf3;n es -g (hacia abajo siempre)","children":[],"payload":{"tag":"h5","lines":"280,281"}},{"content":"Dura un tiempo t_subida = v&#x2080; / g","children":[],"payload":{"tag":"h5","lines":"281,282"}}],"payload":{"tag":"h4","lines":"278,279"}},{"content":"Punto m&#xe1;s alto (v&#xe9;rtice)","children":[{"content":"La velocidad es exactamente cero: v = 0","children":[],"payload":{"tag":"h5","lines":"284,285"}},{"content":"La aceleraci&#xf3;n sigue siendo g hacia abajo (no es cero)","children":[],"payload":{"tag":"h5","lines":"285,286"}},{"content":"Altura m&#xe1;xima: h_max = v&#x2080;&#xb2; / (2g)","children":[],"payload":{"tag":"h5","lines":"286,287"}}],"payload":{"tag":"h4","lines":"283,284"}},{"content":"Fase de bajada","children":[{"content":"El objeto cae como ca&#xed;da libre desde la altura m&#xe1;xima","children":[],"payload":{"tag":"h5","lines":"289,290"}},{"content":"La velocidad aumenta desde 0 hacia abajo","children":[],"payload":{"tag":"h5","lines":"290,291"}},{"content":"Dura el mismo tiempo que la subida: t_bajada = t_subida","children":[],"payload":{"tag":"h5","lines":"291,292"}}],"payload":{"tag":"h4","lines":"288,289"}},{"content":"Simetr&#xed;a temporal","children":[{"content":"El movimiento es sim&#xe9;trico: subida y bajada duran lo mismo","children":[],"payload":{"tag":"h5","lines":"294,295"}},{"content":"Al volver al punto de lanzamiento: v_final = -v&#x2080; (misma rapidez, sentido contrario)","children":[],"payload":{"tag":"h5","lines":"295,296"}},{"content":"t_total = 2 &#xb7; v&#x2080; / g","children":[],"payload":{"tag":"h5","lines":"296,297"}}],"payload":{"tag":"h4","lines":"293,294"}}],"payload":{"tag":"h3","lines":"276,277"}}],"payload":{"tag":"h2","lines":"269,270"}},{"content":"Movimiento en 2D","children":[{"content":"Principio de superposici&#xf3;n","children":[{"content":"En movimiento en 2D (o 3D) cada direcci&#xf3;n es completamente independiente","children":[],"payload":{"tag":"h4","lines":"303,304"}},{"content":"El movimiento en x no afecta al movimiento en y y viceversa","children":[],"payload":{"tag":"h4","lines":"304,305"}},{"content":"Se analizan por separado como dos movimi  velocidad inicial a un &#xe1;ngulo &#x3b8; con la horizontal","children":[],"payload":{"tag":"h4","lines":"329,330"}},{"content":"Combina MRU horizontal (sin aceleraci&#xf3;n) + MRUV vertical (aceleraci&#xf3;n = -g)","children":[],"payload":{"tag":"h4","lines":"330,331"}},{"content":"La trayectoria resultante es una par&#xe1;bola","children":[],"payload":{"tag":"h4","lines":"331,332"}},{"content":"Se desprecia la resistencia del aire y la rotaci&#xf3;n de la Tierra","children":[],"payload":{"tag":"h4","lines":"332,333"}}],"payload":{"tag":"h3","lines":"328,329"}},{"content":"Descomposici&#xf3;n de la velocidad inicial","children":[{"content":"v&#x2080;&#x2093; = v&#x2080; &#xb7; cos(&#x3b8;) &#x2192; componente horizontal inicial (constante durante todo el vuelo)","children":[],"payload":{"tag":"h4","lines":"335,336"}},{"content":"v&#x2080;&#x1d67; = v&#x2080; &#xb7; sen(&#x3b8;) &#x2192; componente vertical inicial (decrece hasta 0 y luego aumenta)","children":[],"payload":{"tag":"h4","lines":"336,337"}}],"payload":{"tag":"h3","lines":"334,335"}},{"content":"Ecuaciones del tiro parab&#xf3;lico","children":[{"content":"Eje horizontal (MRU, a&#x2093; = 0)","children":[{"content":"v&#x2093; = v&#x2080; &#xb7; cos(&#x3b8;) = constante","children":[],"payload":{"tag":"h5","lines":"341,342"}},{"content":"x = v&#x2080; &#xb7; cos(&#x3b8;) &#xb7; t","children":[],"payload":{"tag":"h5","lines":"342,343"}}],"payload":{"tag":"h4","lines":"340,341"}},{"content":"Eje vertical (MRUV, a&#x1d67; = -g)","children":[{"content":"v&#x1d67; = v&#x2080; &#xb7; sen(&#x3b8;) - g &#xb7; t","children":[],"payload":{"tag":"h5","lines":"345,346"}},{"content":"y = v&#x2080; &#xb7; sen(&#x3b8;) &#xb7; t - &#xbd; &#xb7; g &#xb7; t&#xb2;","children":[],"payload":{"tag":"h5","lines":"346,347"}}],"payload":{"tag":"h4","lines":"344,345"}},{"content":"Velocidad en cualquier instante","children":[{"content":"v = &#x221a;(v&#x2093;&#xb2; + v&#x1d67;&#xb2;)","children":[],"payload":{"tag":"h5","lines": "content":"Sustituir en y: y = x&#xb7;tan(&#x3b8;) - [g / (2&#xb7;v&#x2080;&#xb2;&#xb7;cos&#xb2;(&#x3b8;))] &#xb7; x&#xb2;","children":[],"payload":{"tag":"h5","lines":"370,371"}},{"content":"Es la ecuaci&#xf3;n de una par&#xe1;bola (y = ax + bx&#xb2;)","children":[],"payload":{"tag":"h5","lines":"371,372"}}],"payload":{"tag":"h4","lines":"368,369"}}],"payload":{"tag":"h3","lines":"352,353"}},{"content":"Casos especiales del tiro parab&#xf3;lico","children":[{"content":"Lanzamiento horizontal (&#x3b8; = 0&#xb0;)","children":[{"content":"v&#x2080;&#x2093; = v&#x2080;, v&#x2080;&#x1d67; = 0","children":[],"payload":{"tag":"h5","lines":"376,377"}},{"content":"x = v&#x2080; &#xb7; t","children":[],"payload":{"tag":"h5","lines":"377,378"}},{"content":"y = y&#x2080; - &#xbd; &#xb7; g &#xb7; t&#xb2;","children":[],"payload":{"tag":"h5","lines":"378,379"}},{"content":"La velocidad horizontal se mantiene, la vertical crece hacia abajo","children":[],"payload":{"tag":"h5","lines":"379,380"}}],"payload":{"tag":"h4","lines":"375,376"}},{"content":"Lanzamiento desde altura h","children":[{"content":"El objeto cae una altura adicional h antes de llegar al suelo","children":[],"payload":{"tag":"h5","lines":"382,383"}},{"content":"Se sustituye y = -h al final para encontrar t_total","children":[],"payload":{"tag":"h5","lines":"383,384"}}],"payload":{"tag":"h4","lines":"381,382"}}],"payload":{"tag":"h3","lines":"373,374"}},{"content":"Tiro parab&#xf3;lico en rob&#xf3;tica","children":[{"content":"Lanzadores rob&#xf3;ticos (robots que disparan pelotas o proyectiles)","children":[],"payload":{"tag":"h4","lines":"386,387"}},{"content":"C&#xe1;lculo de trayectorias de objetos lanzados por robots","children":[],"payload":{"tag":"h4","lines":"387,388"}},{"content":"Predicci&#xf3;n del punto de ca&#xed;da para que otro robot los atrape","children":[],"payload":{"tag":"h4","lines":"388,389"}},{"content":"Brazos rob&#xf3;ticos que arrojan piezas &#x2192; el efector final tiene velocidad = v& s":"437,438"}}],"payload":{"tag":"h4","lines":"435,436"}},{"content":"Direcci&#xf3;n","children":[{"content":"Siempre perpendicular a la velocidad","children":[],"payload":{"tag":"h5","lines":"440,441"}},{"content":"Siempre apunta hacia el centro del c&#xed;rculo","children":[],"payload":{"tag":"h5","lines":"441,442"}},{"content":"En cada punto del c&#xed;rculo, la direcci&#xf3;n de a_c cambia (siempre hacia el centro)","children":[],"payload":{"tag":"h5","lines":"442,443"}}],"payload":{"tag":"h4","lines":"439,440"}},{"content":"&#xbf;Qui&#xe9;n ejerce la fuerza centr&#xed;peta?","children":[{"content":"La aceleraci&#xf3;n centr&#xed;peta requiere una fuerza neta hacia el centro: F_c = m &#xb7; a_c = m &#xb7; v&#xb2; / r","children":[],"payload":{"tag":"h5","lines":"445,446"}},{"content":"No es una fuerza nueva &#x2192; es el resultado neto de otras fuerzas que ya existen","children":[],"payload":{"tag":"h5","lines":"446,447"}},{"content":"&#xd3;rbita &#x2192; la gravedad act&#xfa;a como fuerza centr&#xed;peta","children":[],"payload":{"tag":"h5","lines":"447,448"}},{"content":"Auto en curva &#x2192; la fricci&#xf3;n de los neum&#xe1;ticos act&#xfa;a como fuerza centr&#xed;peta","children":[],"payload":{"tag":"h5","lines":"448,449"}},{"content":"Pelota en cuerda &#x2192; la tensi&#xf3;n act&#xfa;a como fuerza centr&#xed;peta","children":[],"payload":{"tag":"h5","lines":"449,450"}},{"content":"Centr&#xed;fuga &#x2192; es la reacci&#xf3;n ficticia percibida desde el sistema en rotaci&#xf3;n","children":[],"payload":{"tag":"h5","lines":"450,451"}}],"payload":{"tag":"h4","lines":"444,445"}}],"payload":{"tag":"h3","lines":"428,429"}},{"content":"Gr&#xe1;ficas del MCU","children":[{"content":"&#x3b8; vs t &#x2192; l&#xed;nea recta (&#xe1;ngulo crece uniformemente)","children":[],"payload":{"tag":"h4","lines":"453,454"}},{"content":"&#x3c9; vs t &#x2192; l&#xed;nea horizontal (velocidad angular constante)","children":[],"payload":{"tag":"h4","lines":"454,455"}},{"content": ren":[{"content":"El punto sobre el c&#xed;rculo tiene aceleraci&#xf3;n tangencial si hay aceleraci&#xf3;n angular","children":[],"payload":{"tag":"h4","lines":"501,502"}},{"content":"a_t = &#x3b1; &#xb7; r","children":[],"payload":{"tag":"h4","lines":"502,503"}},{"content":"Act&#xfa;a en la direcci&#xf3;n tangente al c&#xed;rculo","children":[],"payload":{"tag":"h4","lines":"503,504"}},{"content":"Cambia el m&#xf3;dulo de la velocidad lineal","children":[],"payload":{"tag":"h4","lines":"504,505"}}],"payload":{"tag":"h3","lines":"500,501"}},{"content":"Aceleraci&#xf3;n total en MCUV","children":[{"content":"El punto tiene tanto aceleraci&#xf3;n centr&#xed;peta como tangencial","children":[],"payload":{"tag":"h4","lines":"507,508"}},{"content":"a_c = &#x3c9;&#xb2; &#xb7; r &#x2192; apunta al centro","children":[],"payload":{"tag":"h4","lines":"508,509"}},{"content":"a_t = &#x3b1; &#xb7; r &#x2192; apunta en direcci&#xf3;n tangente","children":[],"payload":{"tag":"h4","lines":"509,510"}},{"content":"a_total = &#x221a;(a_c&#xb2; + a_t&#xb2;)","children":[],"payload":{"tag":"h4","lines":"510,511"}},{"content":"&#xc1;ngulo de a_total: &#x3c6; = arctan(a_t / a_c)","children":[],"payload":{"tag":"h4","lines":"511,512"}}],"payload":{"tag":"h3","lines":"506,507"}},{"content":"Ejemplos de MCUV","children":[{"content":"Un motor el&#xe9;ctrico arrancando &#x2192; las aspas aceleran angularmente","children":[],"payload":{"tag":"h4","lines":"514,515"}},{"content":"Un robot m&#xf3;vil acelerando en curva","children":[],"payload":{"tag":"h4","lines":"515,516"}},{"content":"El arranque de un disco de un robot industrial","children":[],"payload":{"tag":"h4","lines":"516,517"}},{"content":"Una centrifugadora encendi&#xe9;ndose","children":[],"payload":{"tag":"h4","lines":"517,518"}}],"payload":{"tag":"h3","lines":"513,514"}}],"payload":{"tag":"h2","lines":"466,467"}},{"content":"Relaciones entre Magnitudes Lineales y Angulares","children":[{"content":"Posici&#xf3;n lineal y angular"," 4","lines":"565,566"}},{"content":"Resultado: la posici&#xf3;n (x, y, z) y orientaci&#xf3;n (roll, pitch, yaw) del efector final","children":[],"payload":{"tag":"h4","lines":"566,567"}}],"payload":{"tag":"h3","lines":"562,563"}},{"content":"Cinem&#xe1;tica inversa (Inverse Kinematics)","children":[{"content":"Dado el destino del efector final &#x2192; calcular los &#xe1;ngulos articulares necesarios","children":[],"payload":{"tag":"h4","lines":"569,570"}},{"content":"Es el problema inverso y generalmente mucho m&#xe1;s dif&#xed;cil","children":[],"payload":{"tag":"h4","lines":"570,571"}},{"content":"Puede no tener soluci&#xf3;n (posici&#xf3;n fuera del workspace)","children":[],"payload":{"tag":"h4","lines":"571,572"}},{"content":"Puede tener m&#xfa;ltiples soluciones (distintas configuraciones que llegan al mismo punto)","children":[],"payload":{"tag":"h4","lines":"572,573"}},{"content":"Se resuelve anal&#xed;ticamente (para robots simples) o num&#xe9;ricamente (Newton-Raphson, Jacobiano inverso)","children":[],"payload":{"tag":"h4","lines":"573,574"}}],"payload":{"tag":"h3","lines":"568,569"}},{"content":"Perfil de velocidad en trayectorias","children":[{"content":"Para mover un robot de A a B suavemente se dise&#xf1;a un perfil de velocidad","children":[],"payload":{"tag":"h4","lines":"576,577"}},{"content":"Perfil trapezoidal","children":[{"content":"Fase de aceleraci&#xf3;n &#x2192; MRUV","children":[],"payload":{"tag":"h5","lines":"578,579"}},{"content":"Fase de velocidad constante &#x2192; MRU","children":[],"payload":{"tag":"h5","lines":"579,580"}},{"content":"Fase de desaceleraci&#xf3;n &#x2192; MRUV","children":[],"payload":{"tag":"h5","lines":"580,581"}}],"payload":{"tag":"h4","lines":"577,578"}},{"content":"Perfil en S (S-curve)","children":[{"content":"Suaviza los cambios de aceleraci&#xf3;n &#x2192; menor vibraci&#xf3;n y desgaste","children":[],"payload":{"tag":"h5","lines":"582,583"}},{"content":"Usa aceleraci&#xf3;n que tambi&#xe9;n var&#xed;a suave
