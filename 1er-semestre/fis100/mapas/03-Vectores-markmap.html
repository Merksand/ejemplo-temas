e como |A| o simplemente A (sin flecha ni negrita)","children":[],"payload":{"tag":"h4","lines":"13,14"}}],"payload":{"tag":"h3","lines":"9,10"}},{"content":"Elementos de un vector","children":[{"content":"M&#xf3;dulo (magnitud)","children":[{"content":"Tama&#xf1;o o intensidad del vector","children":[],"payload":{"tag":"h5","lines":"18,19"}},{"content":"Siempre es un valor positivo o cero","children":[],"payload":{"tag":"h5","lines":"19,20"}},{"content":"Se calcula con el teorema de Pit&#xe1;goras a partir de sus componentes","children":[],"payload":{"tag":"h5","lines":"20,21"}},{"content":"|A| = &#x221a;(A&#x2093;&#xb2; + A&#x1d67;&#xb2;) en 2D","children":[],"payload":{"tag":"h5","lines":"21,22"}},{"content":"|A| = &#x221a;(A&#x2093;&#xb2; + A&#x1d67;&#xb2; + A_z&#xb2;) en 3D","children":[],"payload":{"tag":"h5","lines":"22,23"}}],"payload":{"tag":"h4","lines":"17,18"}},{"content":"Direcci&#xf3;n","children":[{"content":"&#xc1;ngulo que forma el vector con respecto a un eje de referencia (generalmente el eje x positivo)","children":[],"payload":{"tag":"h5","lines":"25,26"}},{"content":"Se mide en grados (&#xb0;) o radianes (rad)","children":[],"payload":{"tag":"h5","lines":"26,27"}},{"content":"&#x3b8; = arctan(A&#x1d67; / A&#x2093;)","children":[],"payload":{"tag":"h5","lines":"27,28"}},{"content":"La direcci&#xf3;n indica la recta sobre la que est&#xe1; el vector","children":[],"payload":{"tag":"h5","lines":"28,29"}}],"payload":{"tag":"h4","lines":"24,25"}},{"content":"Sentido","children":[{"content":"Indica hacia cu&#xe1;l de los dos lados de la recta apunta el vector","children":[],"payload":{"tag":"h5","lines":"31,32"}},{"content":"Se representa con la punta de la flecha","children":[],"payload":{"tag":"h5","lines":"32,33"}},{"content":"Ejemplo: un vector puede ir hacia arriba o hacia abajo sobre la misma recta vertical","children":[],"payload":{"tag":"h5","lines":"33,34"}}],"payload":{"tag":"h4","lines":"30,31"}},{"content":"Punto de aplicaci&#xf3;n","children":[{"content":"Lugar del espacio donde act&#xfa;a el vector","children":[],"payload":{"tag":"h5","lines":"36,37"}},{"content":"Para fuerzas es importante (el torque depende de d&#xf3;nde se aplica la fuerza)","children":[],"payload":{"tag":"h5","lines":"37,38"}},{"content":"Para desplazamientos es el punto de inicio","children":[],"payload":{"tag":"h5","lines":"38,39"}}],"payload":{"tag":"h4","lines":"35,36"}}],"payload":{"tag":"h3","lines":"15,16"}},{"content":"Tipos de vectores seg&#xfa;n su posici&#xf3;n","children":[{"content":"Vector libre","children":[{"content":"Se puede trasladar en el espacio sin cambiar su significado","children":[],"payload":{"tag":"h5","lines":"43,44"}},{"content":"Solo importan m&#xf3;dulo, direcci&#xf3;n y sentido","children":[],"payload":{"tag":"h5","lines":"44,45"}},{"content":"Ejemplo: velocidad, desplazamiento","children":[],"payload":{"tag":"h5","lines":"45,46"}}],"payload":{"tag":"h4","lines":"42,43"}},{"content":"Vector deslizante","children":[{"content":"Solo puede moverse a lo largo de su l&#xed;nea de acci&#xf3;n","children":[],"payload":{"tag":"h5","lines":"48,49"}},{"content":"Ejemplo: fuerzas sobre cuerpos r&#xed;gidos","children":[],"payload":{"tag":"h5","lines":"49,50"}}],"payload":{"tag":"h4","lines":"47,48"}},{"content":"Vector fijo o ligado","children":[{"content":"Tiene un punto de aplicaci&#xf3;n espec&#xed;fico que no puede cambiar","children":[],"payload":{"tag":"h5","lines":"52,53"}},{"content":"Ejemplo: fuerza aplicada en un punto concreto de una estructura","children":[],"payload":{"tag":"h5","lines":"53,54"}}],"payload":{"tag":"h4","lines":"51,52"}}],"payload":{"tag":"h3","lines":"40,41"}},{"content":"Vectores especiales","children":[{"content":"Vector nulo","children":[{"content":"M&#xf3;dulo igual a cero","children":[],"payload":{"tag":"h5","lines":"58,59"}},{"content":"No tiene direcci&#xf3;n ni sentido definidos","children":[],"payload":{"tag":"h5","lines":"59,60"}},{"content":"Resulta de sumar un vector con su opuesto: A + (-A) = 0","children":[],"payload":{"tag":"h5","lines":"60,61"}}],"payload":{"tag":"h4","lines":"57,58"}},{"content":"Vector unitario","children":[{"content":"M&#xf3;dulo igual a 1 (sin unidades)","children":[],"payload":{"tag":"h5","lines":"63,64"}},{"content":"Solo indica direcci&#xf3;n y sentido","children":[],"payload":{"tag":"h5","lines":"64,65"}},{"content":"Se obtiene dividiendo un vector entre su m&#xf3;dulo: &#xfb; = A / |A|","children":[],"payload":{"tag":"h5","lines":"65,66"}},{"content":"Los vectores unitarios de los ejes cartesianos son &#xee;, &#x135;, k&#x302;","children":[],"payload":{"tag":"h5","lines":"66,67"}}],"payload":{"tag":"h4","lines":"62,63"}},{"content":"Vector opuesto","children":[{"content":"Mismo m&#xf3;dulo y direcci&#xf3;n pero sentido contrario","children":[],"payload":{"tag":"h5","lines":"69,70"}},{"content":"El opuesto de A es -A","children":[],"payload":{"tag":"h5","lines":"70,71"}},{"content":"A + (-A) = vector nulo","children":[],"payload":{"tag":"h5","lines":"71,72"}}],"payload":{"tag":"h4","lines":"68,69"}}],"payload":{"tag":"h3","lines":"55,56"}}],"payload":{"tag":"h2","lines":"2,3"}},{"content":"Representaci&#xf3;n gr&#xe1;fica","children":[{"content":"C&#xf3;mo dibujar un vector","children":[{"content":"Se dibuja como una flecha","children":[],"payload":{"tag":"h4","lines":"78,79"}},{"content":"El largo de la flecha es proporcional al m&#xf3;dulo (se elige una escala)","children":[],"payload":{"tag":"h4","lines":"79,80"}},{"content":"La orientaci&#xf3;n de la flecha indica la direcci&#xf3;n","children":[],"payload":{"tag":"h4","lines":"80,81"}},{"content":"La punta indica el sentido","children":[],"payload":{"tag":"h4","lines":"81,82"}},{"content":"El extremo inicial se llama cola y el extremo final se llama punta o cabeza","children":[],"payload":{"tag":"h4","lines":"82,83"}}],"payload":{"tag":"h3","lines":"77,78"}},{"content":"Sistema de referencia","children":[{"content":"Para ubicar un vector se necesita un sistema de coordenadas","children":[],"payload":{"tag":"h4","lines":"85,86"}},{"content":"En 2D: ejes x (horizontal) e y (vertical) perpendiculares entre s&#xed;","children":[],"payload":{"tag":"h4","lines":"86,87"}},{"content":"En 3D: ejes x, y, z mutuamente perpendiculares","children":[],"payload":{"tag":"h4","lines":"87,88"}},{"content":"El &#xe1;ngulo &#x3b8; se mide desde el eje x positivo en sentido antihorario","children":[],"payload":{"tag":"h4","lines":"88,89"}},{"content":"Cuadrantes","children":[{"content":"Primer cuadrante: &#x3b8; entre 0&#xb0; y 90&#xb0; &#x2192; A&#x2093; &gt; 0, A&#x1d67; &gt; 0","children":[],"payload":{"tag":"h5","lines":"90,91"}},{"content":"Segundo cuadrante: &#x3b8; entre 90&#xb0; y 180&#xb0; &#x2192; A&#x2093; &lt; 0, A&#x1d67; &gt; 0","children":[],"payload":{"tag":"h5","lines":"91,92"}},{"content":"Tercer cuadrante: &#x3b8; entre 180&#xb0; y 270&#xb0; &#x2192; A&#x2093; &lt; 0, A&#x1d67; &lt; 0","children":[],"payload":{"tag":"h5","lines":"92,93"}},{"content":"Cuarto cuadrante: &#x3b8; entre 270&#xb0; y 360&#xb0; &#x2192; A&#x2093; &gt; 0, A&#x1d67; &lt; 0","children":[],"payload":{"tag":"h5","lines":"93,94"}}],"payload":{"tag":"h4","lines":"89,90"}}],"payload":{"tag":"h3","lines":"84,85"}},{"content":"Escala gr&#xe1;fica","children":[{"content":"Se elige una escala para representar el m&#xf3;dulo en papel","children":[],"payload":{"tag":"h4","lines":"96,97"}},{"content":"Ejemplo: 1 cm en papel = 10 N de fuerza","children":[],"payload":{"tag":"h4","lines":"97,98"}},{"content":"Todos los vectores del mismo diagrama deben usar la misma escala","children":[],"payload":{"tag":"h4","lines":"98,99"}},{"content":"La escala se indica en el diagrama con una leyenda","children":[],"payload":{"tag":"h4","lines":"99,100"}}],"payload":{"tag":"h3","lines":"95,96"}}],"payload":{"tag":"h2","lines":"75,76"}},{"content":"Magnitud y Direcci&#xf3;n","children":[{"content":"Calcular el m&#xf3;dulo dado el &#xe1;ngulo y los componentes","children":[{"content":"En 2D","children":[{"content":"|A| = &#x221a;(A&#x2093;&#xb2; + A&#x1d67;&#xb2;)","children":[],"payload":{"tag":"h5","lines":"108,109"}},{"content":"Ejemplo: A = (3, 4) &#x2192; |A| = &#x221a;(9 + 16) = &#x221a;25 = 5","children":[],"payload":{"tag":"h5","lines":"109,110"}}],"payload":{"tag":"h4","lines":"107,108"}},{"content":"En 3D","children":[{"content":"|A| = &#x221a;(A&#x2093;&#xb2; + A&#x1d67;&#xb2; + A_z&#xb2;)","children":[],"payload":{"tag":"h5","lines":"112,113"}},{"content":"Ejemplo: A = (1, 2, 2) &#x2192; |A| = &#x221a;(1 + 4 + 4) = &#x221a;9 = 3","children":[],"payload":{"tag":"h5","lines":"113,114"}}],"payload":{"tag":"h4","lines":"111,112"}}],"payload":{"tag":"h3","lines":"105,106"}},{"content":"Calcular el &#xe1;ngulo dado los componentes","children":[{"content":"&#xc1;ngulo con el eje x: &#x3b8; = arctan(A&#x1d67; / A&#x2093;)","children":[],"payload":{"tag":"h4","lines":"117,118"}},{"content":"&#x26a0;&#xfe0f; Importante: verificar el cuadrante antes de dar el &#xe1;ngulo final","children":[],"payload":{"tag":"h4","lines":"118,119"}},{"content":"La calculadora da arctan en el rango (-90&#xb0;, 90&#xb0;) &#x2192; puede estar en el cuadrante incorrecto","children":[],"payload":{"tag":"h4","lines":"119,120"}},{"content":"Regla para corregir el cuadrante","children":[{"content":"A&#x2093; &gt; 0, A&#x1d67; &gt; 0 &#x2192; &#x3b8; est&#xe1; bien (1er cuadrante)","children":[],"payload":{"tag":"h5","lines":"121,122"}},{"content":"A&#x2093; &lt; 0, A&#x1d67; &gt; 0 &#x2192; &#x3b8;_real = 180&#xb0; + arctan(A&#x1d67;/A&#x2093;) (2do cuadrante)","children":[],"payload":{"tag":"h5","lines":"122,123"}},{"content":"A&#x2093; &lt; 0, A&#x1d67; &lt; 0 &#x2192; &#x3b8;_real = 180&#xb0; + arctan(A&#x1d67;/A&#x2093;) (3er cuadrante)","children":[],"payload":{"tag":"h5","lines":"123,124"}},{"content":"A&#x2093; &gt; 0, A&#x1d67; &lt; 0 &#x2192; &#x3b8;_real = 360&#xb0; + arctan(A&#x1d67;/A&#x2093;) (4to cuadrante)","children":[],"payload":{"tag":"h5","lines":"124,125"}}],"payload":{"tag":"h4","lines":"120,121"}}],"payload":{"tag":"h3","lines":"115,116"}},{"content":"&#xc1;ngulos de referencia comunes","children":[{"content":"0&#xb0; &#x2192; vector apunta en la direcci&#xf3;n +x (derecha)","children":[],"payload":{"tag":"h4","lines":"127,128"}},{"content":"90&#xb0; &#x2192; vector apunta en la direcci&#xf3;n +y (arriba)","children":[],"payload":{"tag":"h4","lines":"128,129"}},{"content":"180&#xb0; &#x2192; vector apunta en la direcci&#xf3;n -x (izquierda)","children":[],"payload":{"tag":"h4","lines":"129,130"}},{"content":"270&#xb0; &#x2192; vector apunta en la direcci&#xf3;n -y (abajo)","children":[],"payload":{"tag":"h4","lines":"130,131"}},{"content":"45&#xb0; &#x2192; vector apunta en diagonal entre +x y +y","children":[],"payload":{"tag":"h4","lines":"131,132"}}],"payload":{"tag":"h3","lines":"126,127"}}],"payload":{"tag":"h2","lines":"103,104"}},{"content":"Descomposici&#xf3;n de Vectores en Componentes","children":[{"content":"&#xbf;Para qu&#xe9; descomponer?","children":[{"content":"Trabajar con componentes es mucho m&#xe1;s f&#xe1;cil que con &#xe1;ngulos directamente","children":[],"payload":{"tag":"h4","lines":"138,139"}},{"content":"Permite sumar o restar vectores usando solo &#xe1;lgebra simple","children":[],"payload":{"tag":"h4","lines":"139,140"}},{"content":"Cada componente es una magnitud escalar (puede ser positiva o negativa)","children":[],"payload":{"tag":"h4","lines":"140,141"}},{"content":"Es la base de todo el c&#xe1;lculo vectorial anal&#xed;tico","children":[],"payload":{"tag":"h4","lines":"141,142"}}],"payload":{"tag":"h3","lines":"137,138"}},{"content":"Componentes cartesianas en 2D","children":[{"content":"Componente x (horizontal)","children":[{"content":"A&#x2093; = |A| &#xb7; cos(&#x3b8;)","children":[],"payload":{"tag":"h5","lines":"146,147"}},{"content":"Proyecci&#xf3;n del vector sobre el eje x","children":[],"payload":{"tag":"h5","lines":"147,148"}},{"content":"Positiva si apunta hacia la derecha, negativa si apunta hacia la izquierda","children":[],"payload":{"tag":"h5","lines":"148,149"}}],"payload":{"tag":"h4","lines":"145,146"}},{"content":"Componente y (vertical)","children":[{"content":"A&#x1d67; = |A| &#xb7; sen(&#x3b8;)","children":[],"payload":{"tag":"h5","lines":"151,152"}},{"content":"Proyecci&#xf3;n del vector sobre el eje y","children":[],"payload":{"tag":"h5","lines":"152,153"}},{"content":"Positiva si apunta hacia arriba, negativa si apunta hacia abajo","children":[],"payload":{"tag":"h5","lines":"153,154"}}],"payload":{"tag":"h4","lines":"150,151"}}],"payload":{"tag":"h3","lines":"143,144"}},{"content":"Componentes cartesianas en 3D","children":[{"content":"A&#x2093; = |A| &#xb7; sen(&#x3c6;) &#xb7; cos(&#x3b8;)","children":[],"payload":{"tag":"h4","lines":"157,158"}},{"content":"A&#x1d67; = |A| &#xb7; sen(&#x3c6;) &#xb7; sen(&#x3b8;)","children":[],"payload":{"tag":"h4","lines":"158,159"}},{"content":"A_z = |A| &#xb7; cos(&#x3c6;)","children":[],"payload":{"tag":"h4","lines":"159,160"}},{"content":"&#x3c6; es el &#xe1;ngulo polar (con el eje z) y &#x3b8; es el &#xe1;ngulo azimutal (con el eje x en el plano xy)","children":[],"payload":{"tag":"h4","lines":"160,161"}}],"payload":{"tag":"h3","lines":"155,156"}},{"content":"Notaci&#xf3;n con vectores unitarios","children":[{"content":"Vectores unitarios cartesianos","children":[{"content":"&#xee; (i-sombrero) &#x2192; vector unitario en direcci&#xf3;n x = (1, 0, 0)","children":[],"payload":{"tag":"h5","lines":"165,166"}},{"content":"&#x135; (j-sombrero) &#x2192; vector unitario en direcci&#xf3;n y = (0, 1, 0)","children":[],"payload":{"tag":"h5","lines":"166,167"}},{"content":"k&#x302; (k-sombrero) &#x2192; vector unitario en direcci&#xf3;n z = (0, 0, 1)","children":[],"payload":{"tag":"h5","lines":"167,168"}}],"payload":{"tag":"h4","lines":"164,165"}},{"content":"Expresar un vector en notaci&#xf3;n unitaria","children":[{"content":"A = A&#x2093;&#xb7;&#xee; + A&#x1d67;&#xb7;&#x135; (en 2D)","children":[],"payload":{"tag":"h5","lines":"170,171"}},{"content":"A = A&#x2093;&#xb7;&#xee; + A&#x1d67;&#xb7;&#x135; + A_z&#xb7;k&#x302; (en 3D)","children":[],"payload":{"tag":"h5","lines":"171,172"}},{"content":"Ejemplo: si A&#x2093; = 3, A&#x1d67; = -4 &#x2192; A = 3&#xee; - 4&#x135;","children":[],"payload":{"tag":"h5","lines":"172,173"}}],"payload":{"tag":"h4","lines":"169,170"}}],"payload":{"tag":"h3","lines":"162,163"}},{"content":"Ejemplo completo de descomposici&#xf3;n","children":[{"content":"Vector F con m&#xf3;dulo 50 N a 37&#xb0; sobre la horizontal","children":[],"payload":{"tag":"h4","lines":"175,176"}},{"content":"F&#x2093; = 50 &#xb7; cos(37&#xb0;) = 50 &#xb7; 0.7986 &#x2248; 39.93 N","children":[],"payload":{"tag":"h4","lines":"176,177"}},{"content":"F&#x1d67; = 50 &#xb7; sen(37&#xb0;) = 50 &#xb7; 0.6018 &#x2248; 30.09 N","children":[],"payload":{"tag":"h4","lines":"177,178"}},{"content":"F = 39.93&#xee; + 30.09&#x135; N","children":[],"payload":{"tag":"h4","lines":"178,179"}}],"payload":{"tag":"h3","lines":"174,175"}}],"payload":{"tag":"h2","lines":"135,136"}},{"content":"Suma de Vectores","children":[{"content":"M&#xe9;todo gr&#xe1;fico &#x2014; Cola a punta (pol&#xed;gono)","children":[{"content":"Se coloca el segundo vector con su cola en la punta del primero","children":[],"payload":{"tag":"h4","lines":"185,186"}},{"content":"El vector resultante va desde la cola del primero hasta la punta del &#xfa;ltimo","children":[],"payload":{"tag":"h4","lines":"186,187"}},{"content":"Funciona para sumar cualquier cantidad de vectores","children":[],"payload":{"tag":"h4","lines":"187,188"}},{"content":"Pasos","children":[{"content":"Dibujar el primer vector A desde el origen","children":[],"payload":{"tag":"h5","lines":"189,190"}},{"content":"Dibujar el segundo vector B con su cola en la punta de A","children":[],"payload":{"tag":"h5","lines":"190,191"}},{"content":"El vector resultante R va del origen hasta la punta de B",
