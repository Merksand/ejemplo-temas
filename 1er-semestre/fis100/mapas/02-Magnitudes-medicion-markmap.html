{"tag":"h3","lines":"252,253"}}],"payload":{"tag":"h2","lines":"213,214"}},{"content":"An&#xe1;lisis Dimensional","children":[{"content":"&#xbf;Qu&#xe9; es?","children":[{"content":"T&#xe9;cnica que verifica la consistencia de ecuaciones f&#xed;sicas usando solo las dimensiones","children":[],"payload":{"tag":"h4","lines":"264,265"}},{"content":"Las dimensiones son las magnitudes fundamentales expresadas con s&#xed;mbolos","children":[],"payload":{"tag":"h4","lines":"265,266"}},{"content":"L = longitud | M = masa | T = tiempo | I = corriente | &#x398; = temperatura","children":[],"payload":{"tag":"h4","lines":"266,267"}}],"payload":{"tag":"h3","lines":"263,264"}},{"content":"Notaci&#xf3;n dimensional","children":[{"content":"Se usan corchetes para indicar &quot;dimensi&#xf3;n de&quot;: [v] = L/T = L&#xb7;T&#x207b;&#xb9;","children":[],"payload":{"tag":"h4","lines":"269,270"}},{"content":"[F] = M&#xb7;L&#xb7;T&#x207b;&#xb2;","children":[],"payload":{"tag":"h4","lines":"270,271"}},{"content":"[E] = M&#xb7;L&#xb2;&#xb7;T&#x207b;&#xb2;","children":[],"payload":{"tag":"h4","lines":"271,272"}},{"content":"[P] (potencia) = M&#xb7;L&#xb2;&#xb7;T&#x207b;&#xb3;","children":[],"payload":{"tag":"h4","lines":"272,273"}}],"payload":{"tag":"h3","lines":"268,269"}},{"content":"Principio de homogeneidad dimensional","children":[{"content":"En toda ecuaci&#xf3;n f&#xed;sica correcta, ambos lados deben tener las mismas dimensiones","children":[],"payload":{"tag":"h4","lines":"275,276"}},{"content":"No se pueden sumar o igualar magnitudes de diferente dimensi&#xf3;n","children":[],"payload":{"tag":"h4","lines":"276,277"}},{"content":"Si las dimensiones no coinciden &#x2192; la ecuaci&#xf3;n est&#xe1; mal","children":[],"payload":{"tag":"h4","lines":"277,278"}},{"content":"Si las dimensiones coinciden &#x2192; la ecuaci&#xf3;n puede estar bien (necesita verificaci&#xf3;n num&#xe9;rica)","children":[],"payload":{"tag":"h4","lines":"278,279"}}],"payload":{"tag":"h3","lines":"274,275"}},{"content":"Pasos para el an&#xe1;lisis dimensional","children":[{"content":"Paso 1 &#x2192; escribir la ecuaci&#xf3;n a verificar","children":[],"payload":{"tag":"h4","lines":"281,282"}},{"content":"Paso 2 &#x2192; sustituir cada magnitud por sus dimensiones fundamentales","children":[],"payload":{"tag":"h4","lines":"282,283"}},{"content":"Paso 3 &#x2192; simplificar usando &#xe1;lgebra (cancelar dimensiones comunes)","children":[],"payload":{"tag":"h4","lines":"283,284"}},{"content":"Paso 4 &#x2192; verificar que ambos lados sean iguales","children":[],"payload":{"tag":"h4","lines":"284,285"}}],"payload":{"tag":"h3","lines":"280,281"}},{"content":"Ejemplo 1 &#x2014; Verificar v&#xb2; = v&#x2080;&#xb2; + 2&#xb7;a&#xb7;x","children":[{"content":"Dimensiones de v&#xb2;: (L/T)&#xb2; = L&#xb2;/T&#xb2;","children":[],"payload":{"tag":"h4","lines":"287,288"}},{"content":"Dimensiones de v&#x2080;&#xb2;: (L/T)&#xb2; = L&#xb2;/T&#xb2;","children":[],"payload":{"tag":"h4","lines":"288,289"}},{"content":"Dimensiones de 2&#xb7;a&#xb7;x: (L/T&#xb2;)&#xb7;L = L&#xb2;/T&#xb2;","children":[],"payload":{"tag":"h4","lines":"289,290"}},{"content":"Todos tienen L&#xb2;/T&#xb2; &#x2192; ecuaci&#xf3;n dimensionalmente correcta &#x2705;","children":[],"payload":{"tag":"h4","lines":"290,291"}}],"payload":{"tag":"h3","lines":"286,287"}},{"content":"Ejemplo 2 &#x2014; Verificar E = m&#xb7;v&#xb2; (sin el &#xbd;)","children":[{"content":"Dimensiones de E: M&#xb7;L&#xb2;&#xb7;T&#x207b;&#xb2;","children":[],"payload":{"tag":"h4","lines":"293,294"}},{"content":"Dimensiones de m&#xb7;v&#xb2;: M&#xb7;(L/T)&#xb2; = M&#xb7;L&#xb2;&#xb7;T&#x207b;&#xb2;","children":[],"payload":{"tag":"h4","lines":"294,295"}},{"content":"Ambos lados son iguales &#x2192; dimensionalmente correcta &#x2705;","children":[],"payload":{"tag":"h4","lines":"295,296"}},{"content":"Nota: el an&#xe1;lisis dimensional no detecta constantes num&#xe9;ricas como &#xbd;","children":[],"payload":{"tag":"h4","lines":"296,297"}}],"payloa  tiempo","children":[{"content":"1 min = 60 s","children":[],"payload":{"tag":"h4","lines":"455,456"}},{"content":"1 h = 3600 s","children":[],"payload":{"tag":"h4","lines":"456,457"}},{"content":"1 d&#xed;a = 86 400 s","children":[],"payload":{"tag":"h4","lines":"457,458"}}],"payload":{"tag":"h3","lines":"454,455"}},{"content":"Conversiones de velocidad","children":[{"content":"km/h &#x2192; m/s: dividir entre 3.6 (o multiplicar por 1/3.6)","children":[],"payload":{"tag":"h4","lines":"460,461"}},{"content":"m/s &#x2192; km/h: multiplicar por 3.6","children":[],"payload":{"tag":"h4","lines":"461,462"}},{"content":"1 mph = 1.609 km/h = 0.4470 m/s","children":[],"payload":{"tag":"h4","lines":"462,463"}}],"payload":{"tag":"h3","lines":"459,460"}},{"content":"Conversiones de temperatura","children":[{"content":"&#xb0;C &#x2192; K: T(K) = T(&#xb0;C) + 273.15","children":[],"payload":{"tag":"h4","lines":"465,466"}},{"content":"K &#x2192; &#xb0;C: T(&#xb0;C) = T(K) - 273.15","children":[],"payload":{"tag":"h4","lines":"466,467"}},{"content":"&#xb0;C &#x2192; &#xb0;F: T(&#xb0;F) = T(&#xb0;C) &#xd7; 9/5 + 32","children":[],"payload":{"tag":"h4","lines":"467,468"}},{"content":"&#xb0;F &#x2192; &#xb0;C: T(&#xb0;C) = (T(&#xb0;F) - 32) &#xd7; 5/9","children":[],"payload":{"tag":"h4","lines":"468,469"}}],"payload":{"tag":"h3","lines":"464,465"}},{"content":"Conversiones de fuerza y presi&#xf3;n","children":[{"content":"1 N = 1 kg&#xb7;m/s&#xb2;","children":[],"payload":{"tag":"h4","lines":"471,472"}},{"content":"1 kgf (kilogramo-fuerza) = 9.81 N","children":[],"payload":{"tag":"h4","lines":"472,473"}},{"content":"1 atm = 101 325 Pa = 101.325 kPa","children":[],"payload":{"tag":"h4","lines":"473,474"}},{"content":"1 bar = 100 000 Pa","children":[],"payload":{"tag":"h4","lines":"474,475"}},{"content":"1 psi = 6894.76 Pa","children":[],"payload":{"tag":"h4","lines":"475,476"}}],"payload":{"tag":"h3","lines":"470,471"}},{"content":"Ejemplo paso a paso","children":[{"content":"Convertir 90 km/h a m/s","children":[{"content":"90 km/h &#xd7; (1000 m / 1 km) &#xd7; (1 h / 3600 s)","children":[],"payload":{"tag":"h5","lines":"479,480"}},{"content":"= 90 &#xd7; 1000/3600 m/s","children":[],"payload":{"tag":"h5","lines":"480,481"}},{"content":"= 90/3.6 m/s","children":[],"payload":{"tag":"h5","lines":"481,482"}},{"content":"= 25 m/s &#x2705;","children":[],"payload":{"tag":"h5","lines":"482,483"}}],"payload":{"tag":"h4","lines":"478,479"}}],"payload":{"tag":"h3","lines":"477,478"}},{"content":"Conversiones de &#xe1;rea y volumen","children":[{"content":"1 m&#xb2; = 10 000 cm&#xb2; = 10&#x2074; cm&#xb2;","children":[],"payload":{"tag":"h4","lines":"485,486"}},{"content":"1 m&#xb3; = 1 000 000 cm&#xb3; = 10&#x2076; cm&#xb3;","children":[],"payload":{"tag":"h4","lines":"486,487"}},{"content":"1 m&#xb3; = 1000 litros (L)","children":[],"payload":{"tag":"h4","lines":"487,488"}},{"content":"1 L = 1000 mL = 1000 cm&#xb3;","children":[],"payload":{"tag":"h4","lines":"488,489"}}],"payload":{"tag":"h3","lines":"484,485"}},{"content":"Errores comunes al convertir","children":[{"content":"Olvidar elevar el factor al cuadrado en &#xe1;reas o al cubo en vol&#xfa;menes","children":[],"payload":{"tag":"h4","lines":"491,492"}},{"content":"1 m&#xb2; &#x2260; 100 cm&#xb2; &#x2192; 1 m&#xb2; = (100 cm)&#xb2; = 10 000 cm&#xb2;","children":[],"payload":{"tag":"h4","lines":"492,493"}},{"content":"Invertir el factor de conversi&#xf3;n &#x2192; siempre verificar que la unidad no deseada se cancele","children":[],"payload":{"tag":"h4","lines":"493,494"}}],"payload":{"tag":"h3","lines":"490,491"}}],"payload":{"tag":"h2","lines":"425,426"}},{"content":"Errores de Medici&#xf3;n","children":[{"content":"&#xbf;Por qu&#xe9; existe el error?","children":[{"content":"Ning&#xfa;n instrumento es perfectamente preciso","children":[],"payload":{"tag":"h4","lines":"500,501"}},{"content":"El observador puede influir en la medici&#xf3;n","children":[],"payload":{"tag":"h4","lines":"501,502"}},{"content":"Las condiciones del entorno var&#xed;an (temperatura, vibraci&#xf3;n, humedad)","children":[],"payload":{"tag":"h4","lines":"502,503"}},{"content":"La magnitud misma puede fluctuar","children":[],"payload":{"tag":"h4","lines":"503,504"}},{"content":"Toda medici&#xf3;n real tiene un grado de incertidumbre","children":[],"payload":{"tag":"h4","lines":"504,505"}}],"payload":{"tag":"h3","lines":"499,500"}},{"content":"Conceptos importantes","children":[{"content":"Valor verdadero","children":[{"content":"El valor real de la magnitud, que nunca se conoce con exactitud perfecta","children":[],"payload":{"tag":"h5","lines":"509,510"}},{"content":"Se aproxima tomando m&#xfa;ltiples mediciones","children":[],"payload":{"tag":"h5","lines":"510,511"}}],"payload":{"tag":"h4","lines":"508,509"}},{"content":"Valor medido","children":[{"content":"El valor que indica el instrumento en una medici&#xf3;n particular","children":[],"payload":{"tag":"h5","lines":"513,514"}}],"payload":{"tag":"h4","lines":"512,513"}},{"content":"Exactitud","children":[{"content":"Qu&#xe9; tan cerca est&#xe1; la medici&#xf3;n del valor verdadero","children":[],"payload":{"tag":"h5","lines":"516,517"}},{"content":"Alta exactitud &#x2192; el valor medido est&#xe1; cerca del valor real","children":[],"payload":{"tag":"h5","lines":"517,518"}}],"payload":{"tag":"h4","lines":"515,516"}},{"content":"Precisi&#xf3;n","children":[{"content":"Qu&#xe9; tan reproducibles son las mediciones entre s&#xed;","children":[],"payload":{"tag":"h5","lines":"520,521"}},{"content":"Alta precisi&#xf3;n &#x2192; las mediciones se repiten con resultados muy similares","children":[],"payload":{"tag":"h5","lines":"521,522"}},{"content":"Un instrumento puede ser preciso pero no exacto (mide consistentemente mal)","children":[],"payload":{"tag":"h5","lines":"522,523"}},{"content":"Un instrumento puede ser exacto pero no preciso (a veces acierta, a veces no)","children":[],"payload":{"tag":"h5","lines":"523,524"}}],"payload":{"tag":"h4","lines":"519,520"}}],"payload":{"tag":"h3","lines":"506,507"}},{"content":"Tipos de errores","children":[{"content":"Error sistem&#xe1;tico","children":[{"content":"Ocurre siempre en la misma direcci&#xf3;n (siempre mide de m&#xe1;s o de menos)","children":[],"payload":{"tag":"h5","lines":"528,529"}},{"content":"Causas comunes","children":[{"content":"Instrumento mal calibrado (una balanza que siempre marca +50 g)","children":[],"payload":{"tag":"h6","lines":"530,531"}},{"content":"Punto de cero incorrecto","children":[],"payload":{"tag":"h6","lines":"531,532"}},{"content":"Error de paralaje (leer un instrumento anal&#xf3;gico desde un &#xe1;ngulo incorrecto)","children":[],"payload":{"tag":"h6","lines":"532,533"}}],"payload":{"tag":"h5","lines":"529,530"}},{"content":"Se puede detectar y corregir calibrando el instrumento","children":[],"payload":{"tag":"h5","lines":"533,534"}},{"content":"Afecta la exactitud pero no necesariamente la precisi&#xf3;n","children":[],"payload":{"tag":"h5","lines":"534,535"}}],"payload":{"tag":"h4","lines":"527,528"}},{"content":"Error aleatorio","children":[{"content":"Var&#xed;a de manera impredecible en cada medici&#xf3;n","children":[],"payload":{"tag":"h5","lines":"537,538"}},{"content":"Causas comunes","children":[{"content":"Vibraciones del entorno","children":[],"payload":{"tag":"h6","lines":"539,540"}},{"content":"Fluctuaciones el&#xe9;ctricas en el instrumento","children":[],"payload":{"tag":"h6","lines":"540,541"}},{"content":"Variaciones en la habilidad del observador","children":[],"payload":{"tag":"h6","lines":"541,542"}}],"payload":{"tag":"h5","lines":"538,539"}},{"content":"Se reduce tomando muchas mediciones y promediando","children":[],"payload":{"tag":"h5","lines":"542,543"}},{"content":"Afecta la precisi&#xf3;n pero no necesariamente la exactitud","children":[],"payload":{"tag":"h5","lines":"543,544"}}],"payload":{"tag":"h4","lines":"536,537"}},{"content":"Error humano (o de procedimiento)","children":[{"content":"Errores por descuido, mala lectura o procedimiento incorrecto","children":[],"payload":{"tag":"h5","lines":"546,547"}},{"content":"Ejemplos","children":[{"content":"Leer 5.6 en vez de 5.0 por error de visi&#xf3;n","children":[],"payload":{"tag":"h6","lines":"548,549"}},{"content":"Olvidar tarar la balanza antes de medir","children":[],"payload":{"tag":"h6","lines":"549,550"}},{"content":"No esperar a que el instrumento se estabilice","children":[],"payload":{"tag":"h6","lines":"550,551"}}],"payload":{"tag":"h5","lines":"547,548"}},{"content":"Se evita con buenas pr&#xe1;cticas y entrenamiento","children":[],"payload":{"tag":"h5","lines":"551,552"}}],"payload":{"tag":"h4","lines":"545,546"}}],"payload":{"tag":"h3","lines":"525,526"}},{"content":"Error absoluto (&#x394;x)","children":[{"content":"Definici&#xf3;n","children":[{"content":"Diferencia entre el valor medido y el valor verdadero (o valor aceptado)","children":[],"payload":{"tag":"h5","lines":"556,557"}},{"content":"&#x394;x = |x_medido - x_real|","children":[],"payload":{"tag":"h5","lines":"557,558"}},{"content":"Siempre se expresa como positivo (valor absoluto)","children":[],"payload":{"tag":"h5","lines":"558,559"}},{"content":"Tiene las mismas unidades que la magnitud medida","children":[],"payload":{"tag":"h5","lines":"559,560"}}],"payload":{"tag":"h4","lines":"555,556"}},{"content":"Ejemplo","children":[{"content":"Valor real de una resistencia: 100 &#x3a9;","children":[],"payload":{"tag":"h5","lines":"562,563"}},{"content":"Valor medido con mult&#xed;metro: 97 &#x3a9;","children":[],"payload":{"tag":"h5","lines":"563,564"}},{"content":"Error absoluto: &#x394;x = |97 - 100| = 3 &#x3a9;","children":[],"payload":{"tag":"h5","lines":"564,565"}}],"payload":{"tag":"h4","lines":"561,562"}},{"content":"Incertidumbre del instrumento","children":[{"content":"El error m&#xed;nimo de un instrumento es la mitad de su divisi&#xf3;n m&#xed;nima","children":[],"payload":{"tag":"h5","lines":"567,568"}},{"content":"Una regla con divisiones de 1 mm tiene incertidumbre de &#xb1;0.5 mm","children":[],"payload":{"tag":"h5","lines":"568,569"}},{"content":"Un term&#xf3;metro con divisiones de 1&#xb0;C tiene incertidumbre de &#xb1;0.5&#xb0;C","children":[],"payload":{"tag":"h5","lines":"569,570"}}],"payload":{"tag":"h4","lines":"566,567"}}],"payload":{"tag":"h3","lines":"553,554"}},{"content":"Error relativo (Er)","children":[{"content":"Definici&#xf3;n","children":[{"content":"Cociente entre el error absoluto y el valor real","children":[],"payload":{"tag":"h5","lines":"574,575"}},{"content":"Er = &#x394;x / x_real","children":[],"payload":{"tag":"h5","lines":"575,576"}},{"content":"Es adimensional (sin unidades)","children":[],"payload":{"tag":"h5","lines":"576,577"}},{"content":"Permite comparar errores entre mediciones de distintas magnitudes","children":[],"payload":{"tag":"h5","lines":"577,578"}}],"payload":{"tag":"h4","lines":"573,574"}},{"content":"Ejemplo","children":[{"content":"&#x394;x = 3 &#x3a9;, x_real = 100 &#x3a9;","children":[],"payload":{"tag":"h5","lines":"580,581"}},{"content":"Er = 3/100 = 0.03","children":[],"payload":{"tag":"h5","lines":"581,582"}}],"payload":{"tag":"h4","lines":"579,580"}},{"content":"Interpretaci&#xf3;n","children":[{"content":"Er = 0.03 significa que el error es el 3% del valor real","children":[],"payload":{"tag":"h5","lines":"584,585"}},{"content":"Cuanto m&#xe1;s peque&#xf1;o es Er &#x2192; mayor precisi&#xf3;n de la medici&#xf3;n","children":[],"payload":{"tag":"h5","lines":"585,586"}}],"payload":{"tag":"h4","lines":"583,584"}}],"payload":{"tag":"h3","lines":"571,572"}},{"content":"Error porcentual (E%)","children":[{"content":"Definici&#xf3;n","children":[{"content":"Error relativo expresado en porcentaje","children":[],"payload":{"tag":"h5","lines":"590,591"}},{"content":"E% = (&#x394;x / x_real) &#xd7; 100%","children":[],"payload":{"tag":"h5","lines":"591,592"}},{"content":"Es la forma m&#xe1;s intuitiva de comunicar el error","children":[],"payload":{"tag":"h5","lines":"592,593"}}],"payload":{"tag":"h4","lines":"589,590"}},{"content":"Ejemplo","children":[{"content":"E% = (3/100) &#xd7; 100% = 3%","children":[],"payload":{"tag":"h5","lines":"595,596"}}],"payload":{"tag":"h4","lines":"594,595"}},{"content":"Interpretaci&#xf3;n pr&#xe1;ctica","children":[{"content":"E% &lt; 1% &#x2192; medici&#xf3;n muy precisa","children":[],"payload":{"tag":"h5","lines":"598,599"}},{"content":"E% entre 1% y 5% &#x2192; medici&#xf3;n aceptable en muchos contextos","children":[],"payload":{"tag":"h5","lines":"599,600"}},{"content":"E% &gt; 10% &#x2192; medici&#xf3;n poco confiable","children":[],"payload":{"tag":"h5","lines":"600,601"}}],"payload":{"tag":"h4","lines":"597,598"}}],"payload":{"tag":"h3","lines":"587,588"}},{"content":"Propagaci&#xf3;n de errores","children":[{"content":"Cuando se combina m&#xe1;s de una magnitud medida, los errores se propagan","children":[],"payload":{"tag":"h4","lines":"604,605"}},{"content":"Suma/resta: &#x394;z = &#x394;x + &#x394;y (los errores absolutos se suman)","children":[],"payload":{"tag":"h4","lines":"605,606"}},{"content":"Multiplicaci&#xf3;n/divisi&#xf3;n: Ez% = Ex% + Ey% (los errores porcentuales se suman)","children":[],"payload":{"tag":"h4","lines":"606,607"}},{"content":"Potencias: Ez% = n &#xd7; Ex% (donde n es el exponente)","children":[],"payload":{"tag":"h4","lines":"607,608"}}],"payload":{"tag":"h3","lines":"602,603"}},{"content":"C&#xf3;mo reducir los errores","children":[{"content":"Calibrar los instrumentos regularmente","children":[],"payload":{"tag":"h4","lines":"611,612"}},{"content":"Tomar m&#xfa;ltiples mediciones y promediar","children":[],"payload":{"tag":"h4","lines":"612,613"}},{"content":"Usar instrumentos de mayor precisi&#xf3;n","children":[],"payload":{"tag":"h4","lines":"613,614"}},{"content":"Controlar las condiciones del entorno","children":[],"payload":{"tag":"h4","lines":"614,615"}},{"content":"Aplicar correcciones por errores sistem&#xe1;ticos conocidos","children":[],"payload":{"tag":"h4","lines":"615,616"}},{"content":"Entrenar al observador en el procedimiento correcto","children":[],"payload":{"tag":"h4","lines":"616,617"}}],"payload":{"tag":"h3","lines":"609,610"}},{"content":"Importancia en rob&#xf3;tica","children":[{"content":"Los sensores tienen errores inherentes que afectan la navegaci&#xf3;n y el control","children":[],"payload":{"tag":"h4","lines":"619,620"}},{"content":"Un robot con encoder de posici&#xf3;n debe compensar el error acumulado (odometr&#xed;a)","children":[],"payload":{"tag":"h4","lines":"620,621"}},{"content":"El filtro de Kalman es una t&#xe9;cnica que fusiona mediciones con errores para obtener estimaciones m&#xe1;s precisas","children":[],"payload":{"tag":"h4","lines":"621,622"}},{"content":"La calibraci&#xf3;n de sensores es una etapa fundamental en el comisionamiento de robots","children":[],"payload":{"tag":"h4","lines":"622,623"}}],"payload":{"tag":"h3","lines":"618,619"}}],"payload":{"tag":"h2","lines":"497,498"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
