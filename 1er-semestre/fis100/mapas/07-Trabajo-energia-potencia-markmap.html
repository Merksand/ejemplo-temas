&#x2192; m&#xf3;dulo del desplazamiento (m)","children":[],"payload":{"tag":"h4","lines":"14,15"}},{"content":"&#x3b8; &#x2192; &#xe1;ngulo entre el vector fuerza y el vector desplazamiento","children":[],"payload":{"tag":"h4","lines":"15,16"}},{"content":"Tambi&#xe9;n se puede escribir como producto punto: W = &#x2192;F &#xb7; &#x2192;d","children":[],"payload":{"tag":"h4","lines":"16,17"}}],"payload":{"tag":"h3","lines":"11,12"}},{"content":"Interpretaci&#xf3;n del &#xe1;ngulo &#x3b8;","children":[{"content":"&#x3b8; = 0&#xb0; &#x2192; fuerza paralela al desplazamiento (misma direcci&#xf3;n y sentido)","children":[{"content":"cos(0&#xb0;) = 1 &#x2192; W = F&#xb7;d (trabajo m&#xe1;ximo positivo)","children":[],"payload":{"tag":"h5","lines":"21,22"}},{"content":"La fuerza ayuda completamente al movimiento","children":[],"payload":{"tag":"h5","lines":"22,23"}},{"content":"Ejemplo: empujar una caja en la direcci&#xf3;n que se mueve","children":[],"payload":{"tag":"h5","lines":"23,24"}}],"payload":{"tag":"h4","lines":"20,21"}},{"content":"&#x3b8; = 90&#xb0; &#x2192; fuerza perpendicular al desplazamiento","children":[{"content":"cos(90&#xb0;) = 0 &#x2192; W = 0 (trabajo nulo)","children":[],"payload":{"tag":"h5","lines":"26,27"}},{"content":"La fuerza no transfiere energ&#xed;a al movimiento","children":[],"payload":{"tag":"h5","lines":"27,28"}},{"content":"Ejemplo: la fuerza normal sobre un objeto que se mueve horizontalmente","children":[],"payload":{"tag":"h5","lines":"28,29"}},{"content":"Ejemplo: la fuerza centr&#xed;peta sobre un objeto en MCU","children":[],"payload":{"tag":"h5","lines":"29,30"}}],"payload":{"tag":"h4","lines":"25,26"}},{"content":"&#x3b8; = 180&#xb0; &#x2192; fuerza antiparalela al desplazamiento (sentidos opuestos)","children":[{"content":"cos(180&#xb0;) = -1 &#x2192; W = -F&#xb7;d (trabajo negativo m&#xe1;ximo)","children":[],"payload":{"tag":"h5","lines":"32,33"}},{"content":"La fuerza se opone al movimiento &#x2192; extrae energ&#xed;a del sistema","children":[],"payload":{"tag":"h5","lines":"33,34"}},{"content":"Ejemplo: la fricci&#xf3;n cin&#xe9;tica sobre un objeto en movimiento","children":[],"payload":{"tag":"h5","lines":"34,35"}},{"content":"Ejemplo: la gravedad sobre un objeto que sube","children":[],"payload":{"tag":"h5","lines":"35,36"}}],"payload":{"tag":"h4","lines":"31,32"}},{"content":"0&#xb0; &lt; &#x3b8; &lt; 90&#xb0; &#x2192; trabajo positivo (la fuerza ayuda parcialmente)","children":[],"payload":{"tag":"h4","lines":"37,38"}},{"content":"90&#xb0; &lt; &#x3b8; &lt; 180&#xb0; &#x2192; trabajo negativo (la fuerza frena parcialmente)","children":[],"payload":{"tag":"h4","lines":"38,39"}}],"payload":{"tag":"h3","lines":"18,19"}},{"content":"Trabajo positivo, negativo y nulo","children":[{"content":"Trabajo positivo (W &gt; 0)","children":[{"content":"La fuerza transfiere energ&#xed;a al objeto &#x2192; el objeto gana energ&#xed;a","children":[],"payload":{"tag":"h5","lines":"43,44"}},{"content":"El objeto tiende a acelerar en la direcci&#xf3;n del movimiento","children":[],"payload":{"tag":"h5","lines":"44,45"}},{"content":"Ejemplos: motor acelerando un auto, resorte impulsando un bloque, tensi&#xf3;n levantando un peso","children":[],"payload":{"tag":"h5","lines":"45,46"}}],"payload":{"tag":"h4","lines":"42,43"}},{"content":"Trabajo negativo (W &lt; 0)","children":[{"content":"La fuerza extrae energ&#xed;a del objeto &#x2192; el objeto pierde energ&#xed;a","children":[],"payload":{"tag":"h5","lines":"48,49"}},{"content":"El objeto tiende a desacelerar","children":[],"payload":{"tag":"h5","lines":"49,50"}},{"content":"Ejemplos: fricci&#xf3;n frenando un auto, gravedad sobre un objeto que sube, frenos en una bicicleta","children":[],"payload":{"tag":"h5","lines":"50,51"}}],"payload":{"tag":"h4","lines":"47,48"}},{"content":"Trabajo nulo (W = 0)","children":[{"content":"No hay transferencia de energ&#xed;a entre la fuerza y el objeto","children":[],"payload":{"tag":"h5","lines":"53,54"}},{"content":"Casos posibles","children":[{"content":"d = 0 &#x2192; no hay desplazamiento (empujar una pared)","children":[],"payload":{"tag":"h6","lines":"55,56"}},{"content":"&#x3b8; = 90&#xb0; &#x2192; fuerza perpendicular al desplazamiento","children":[],"payload":{"tag":"h6","lines":"56,57"}},{"content":"F = 0 &#x2192; no hay fuerza aplicada","children":[],"payload":{"tag":"h6","lines":"57,58"}}],"payload":{"tag":"h5","lines":"54,55"}}],"payload":{"tag":"h4","lines":"52,53"}}],"payload":{"tag":"h3","lines":"40,41"}},{"content":"Trabajo total o trabajo neto","children":[{"content":"Es la suma algebraica de los trabajos realizados por todas las fuerzas sobre el objeto","children":[],"payload":{"tag":"h4","lines":"60,61"}},{"content":"W_neto = W&#x2081; + W&#x2082; + W&#x2083; + ... = &#x3a3;W&#x1d62;","children":[],"payload":{"tag":"h4","lines":"61,62"}},{"content":"Es igual al trabajo de la fuerza resultante","children":[],"payload":{"tag":"h4","lines":"62,63"}},{"content":"W_neto = F_neta &#xb7; d &#xb7; cos(&#x3b8;)","children":[],"payload":{"tag":"h4","lines":"63,64"}},{"content":"El trabajo neto es el que produce cambios en la energ&#xed;a cin&#xe9;tica del objeto","children":[],"payload":{"tag":"h4","lines":"64,65"}}],"payload":{"tag":"h3","lines":"59,60"}}],"payload":{"tag":"h2","lines":"2,3"}},{"content":"Trabajo de una Fuerza Constante","children":[{"content":"Definici&#xf3;n","children":[{"content":"La fuerza no cambia ni en m&#xf3;dulo ni en direcci&#xf3;n durante todo el desplazamiento","children":[],"payload":{"tag":"h4","lines":"71,72"}},{"content":"Es el caso m&#xe1;s sencillo y directo de calcular","children":[],"payload":{"tag":"h4","lines":"72,73"}},{"content":"W = F &#xb7; d &#xb7; cos(&#x3b8;) &#x2192; una sola aplicaci&#xf3;n de la f&#xf3;rmula","children":[],"payload":{"tag":"h4","lines":"73,74"}}],"payload":{"tag":"h3","lines":"70,71"}},{"content":"Trabajo del peso (gravedad)","children":[{"content":"El peso W = mg act&#xfa;a siempre hacia abajo","children":[],"payload":{"tag":"h4","lines":"76,77"}},{"content":"W_gravedad = m&#xb7;g&#xb7;h (donde h es el desplazamiento vertical)","children":[],"payload":{"tag":"h4","lines":"77,78"}},{"content":"Si el objeto baja una altura h &#x2192; W_gravedad = +m&#xb7;g&#xb7;h (positivo)","children":[],"payload":{"tag":"h4","lines":"78,79"}},{"content":"Si el objeto sube una altura h &#x2192; W_gravedad = -m&#xb7;g&#xb7;h (negativo)","children":[],"payload":{"tag":"h4","lines":"79,80"}},{"content":"El trabajo del peso no depende del camino &#x2192; solo de la diferencia de altura","children":[],"payload":{"tag":"h4","lines":"80,81"}},{"content":"Esta propiedad es caracter&#xed;stica de las fuerzas conservativas","children":[],"payload":{"tag":"h4","lines":"81,82"}}],"payload":{"tag":"h3","lines":"75,76"}},{"content":"Trabajo de la fuerza normal","children":[{"content":"La normal siempre es perpendicular a la superficie &#x2192; &#x3b8; = 90&#xb0; con el desplazamiento horizontal","children":[],"payload":{"tag":"h4","lines":"84,85"}},{"content":"W_normal = 0 siempre en movimiento horizontal","children":[],"payload":{"tag":"h4","lines":"85,86"}},{"content":"Si hay componente vertical del desplazamiento &#x2192; puede haber trabajo","children":[],"payload":{"tag":"h4","lines":"86,87"}}],"payload":{"tag":"h3","lines":"83,84"}},{"content":"Trabajo de la fricci&#xf3;n cin&#xe9;tica","children":[{"content":"fk act&#xfa;a siempre opuesta al movimiento &#x2192; &#x3b8; = 180&#xb0;","children":[],"payload":{"tag":"h4","lines":"89,90"}},{"content":"W_fricci&#xf3;n = -fk &#xb7; d = -&#x3bc;k &#xb7; N &#xb7; d","children":[],"payload":{"tag":"h4","lines":"90,91"}},{"content":"Siempre negativo &#x2192; siempre extrae energ&#xed;a del sistema","children":[],"payload":{"tag":"h4","lines":"91,92"}},{"content":"La energ&#xed;a extra&#xed;da se convierte en calor (disipaci&#xf3;n t&#xe9;rmica)","children":[],"payload":{"tag":"h4","lines":"92,93"}}],"payload":{"tag":"h3","lines":"88,89"}},{"content":"Trabajo en plano inclinado","children":[{"content":"Una caja se mueve una distancia d a lo largo del plano inclinado (&#xe1;ngulo &#x3b8;)","children":[],"payload":{"tag":"h4","lines":"95,96"}},{"content":"Trabajo del peso: W_peso = m&#xb7;g&#xb7;sen(&#x3b8;)&#xb7;d (si baja) o -m&#xb7;g&#xb7;sen(&#x3b8;)&#xb7;d (si sube)","children":[],"payload":{"tag":"h4","lines":"96,97"}},{"content":"Trabajo de la normal: W_N = 0 (perpendicular al desplazamiento)","children":[],"payload":{"tag":"h4","lines":"97,98"}},{"content":"Trabajo de la fricci&#xf3;n: W_f = -&#x3bc;k&#xb7;m&#xb7;g&#xb7;cos(&#x3b8;)&#xb7;d (si hay deslizamiento)","children":[],"payload":{"tag":"h4","lines":"98,99"}}],"payload":{"tag":"h3","lines":"94,95"}}],"payload":{"tag":"h2","lines":"68,69"}},{"content":"Trabajo de una Fuerza Variable","children":[{"content":"&#xbf;Cu&#xe1;ndo la fuerza es variable?","children":[{"content":"La fuerza cambia de m&#xf3;dulo, direcci&#xf3;n o ambos durante el desplazamiento","children":[],"payload":{"tag":"h4","lines":"105,106"}},{"content":"No se puede usar directamente W = F&#xb7;d&#xb7;cos(&#x3b8;) &#x2192; esa F ser&#xed;a diferente en cada punto","children":[],"payload":{"tag":"h4","lines":"106,107"}},{"content":"Se necesita integraci&#xf3;n o el &#xe1;rea bajo la curva F vs x","children":[],"payload":{"tag":"h4","lines":"107,108"}}],"payload":{"tag":"h3","lines":"104,105"}},{"content":"Trabajo como integral","children":[{"content":"W = &#x222b;(de x&#x1d62; a x_f) F(x) dx","children":[],"payload":{"tag":"h4","lines":"110,111"}},{"content":"Se integra la fuerza a lo largo del camino desde la posici&#xf3;n inicial a la final","children":[],"payload":{"tag":"h4","lines":"111,112"}},{"content":"Geom&#xe9;tricamente es el &#xe1;rea bajo la curva F(x) vs x entre los l&#xed;mites de integraci&#xf3;n","children":[],"payload":{"tag":"h4","lines":"112,113"}}],"payload":{"tag":"h3","lines":"109,110"}},{"content":"Trabajo del resorte (Ley de Hooke)","children":[{"content":"La fuerza del resorte var&#xed;a linealmente con la deformaci&#xf3;n: F = -k&#xb7;x","children":[],"payload":{"tag":"h4","lines":"115,116"}},{"content":"La fuerza que se aplica al resorte para deformarlo es F_ap = k&#xb7;x (opuesta a la del resorte)","children":[],"payload":{"tag":"h4","lines":"116,117"}},{"content":"Trabajo realizado para estirar el resorte de x=0 a x=X","children":[{"content":"W_resorte = &#x222b;(0 a X) k&#xb7;x dx = &#xbd;&#xb7;k&#xb7;X&#xb2;","children":[],"payload":{"tag":"h5","lines":"118,119"}}],"payload":{"tag":"h4","lines":"117,118"}},{"content":"Trabajo del resorte sobre el objeto (al soltarlo)","children":[{"content":"W_resorte = -&#xbd;&#xb7;k&#xb7;x_f&#xb2; + &#xbd;&#xb7;k&#xb7;x_i&#xb2;","children":[],"payload":{"tag":"h5","lines":"120,121"}}],"payload":{"tag":"h4","lines":"119,120"}},{"content":"El resorte almacena energ&#xed;a cuando se deforma y la libera cuando vuelve a su posici&#xf3;n natural","children":[],"payload":{"tag":"h4","lines":"121,122"}}],"payload":{"tag":"h3","lines":"114,115"}},{"content":"&#xc1;rea bajo la curva F vs x","children":[{"content":"Para fuerzas arbitrarias se puede aproximar el trabajo dividiendo el desplazamiento en intervalos peque&#xf1;os","children":[],"payload":{"tag":"h4","lines":"124,125"}},{"content":"En cada intervalo peque&#xf1;o &#x394;x la fuerza es aproximadamente constante &#x2192; &#x394;W &#x2248; F(x)&#xb7;&#x394;x","children":[],"payload":{"tag":"h4","lines":"125,126"}},{"content":"Sumando todos los intervalos &#x2192; W &#x2248; &#x3a3;F(x&#x1d62;)&#xb7;&#x394;x","children":[],"payload":{"tag":"h4","lines":"126,127"}},{"content":"En el l&#xed;mite &#x394;x&#x2192;0 &#x2192; esto se convierte en la integral &#x2192; W = &#x222b;F(x)dx","children":[],"payload":{"tag":"h4","lines":"127,128"}}],"payload":{"tag":"h3","lines":"123,124"}}],"payload":{"tag":"h2","lines":"102,103"}},{"content":"Energ&#xed;a Cin&#xe9;tica","children":[{"content":"Definici&#xf3;n","children":[{"content":"Energ&#xed;a que posee un objeto debido a su movimiento","children":[],"payload":{"tag":"h4","lines":"134,135"}},{"content":"Todo cuerpo en movimiento tiene energ&#xed;a cin&#xe9;tica","children":[],"payload":{"tag":"h4","lines":"135,136"}},{"content":"Es una magnitud escalar &#x2192; siempre positiva o cero (nunca negativa)","children":[],"payload":{"tag":"h4","lines":"136,137"}},{"content":"Unidad SI: Joule (J)","children":[],"payload":{"tag":"h4","lines":"137,138"}}],"payload":{"tag":"h3","lines":"133,134"}},{"content":"F&#xf3;rmula","children":[{"content":"Ec = &#xbd; &#xb7; m &#xb7; v&#xb2;","children":[],"payload":{"tag":"h4","lines":"140,141"}},{"content":"m &#x2192; masa del objeto (kg)","children":[],"payload":{"tag":"h4","lines":"141,142"}},{"content":"v &#x2192; rapidez del objeto (m/s)","children":[],"payload":{"tag":"h4","lines":"142,143"}},{"content":"Si v = 0 &#x2192; Ec = 0 (objeto en reposo)","children":[],"payload":{"tag":"h4","lines":"143,144"}},{"content":"Si v se duplica &#x2192; Ec se cuadruplica (crece con el cuadrado de la velocidad)","children":[],"payload":{"tag":"h4","lines":"144,145"}},{"content":"Si m se duplica &#x2192; Ec se duplica (crece linealmente con la masa)","children":[],"payload":{"tag":"h4","lines":"145,146"}}],"payload":{"tag":"h3","lines":"139,140"}},{"content":"Energ&#xed;a cin&#xe9;tica traslacional vs rotacional","children":[{"content":"Traslacional: Ec_t = &#xbd;&#xb7;m&#xb7;v&#xb2; &#x2192; movimiento del centro de masa","children":[],"payload":{"tag":"h4","lines":"148,149"}},{"content":"Rotacional: Ec_r = &#xbd;&#xb7;I&#xb7;&#x3c9;&#xb2; &#x2192; movimiento de rotaci&#xf3;n alrededor del CM","children":[],"payload":{"tag":"h4","lines":"149,150"}},{"content":"Un cuerpo que rueda tiene ambas: Ec_total = &#xbd;&#xb7;m&#xb7;v&#xb2; + &#xbd;&#xb7;I&#xb7;&#x3c9;&#xb2;","children":[],"payload":{"tag":"h4","lines":"150,151"}}],"payload":{"tag":"h3","lines":"147,148"}},{"content":"Ejemplos de energ&#xed;a cin&#xe9;tica","children":[{"content":"Auto (1000 kg) a 100 km/h (27.78 m/s): Ec = &#xbd;&#xb7;1000&#xb7;27.78&#xb2; &#x2248; 385 714 J &#x2248; 386 kJ","children":[],"payload":{"tag":"h4","lines":"153,154"}},{"content":"Bala (10 g) a 900 m/s: Ec = &#xbd;&#xb7;0.01&#xb7;900&#xb2; = 4050 J &#x2192; much&#xed;simo por la v&#xb2;","children":[],"payload":{"tag":"h4","lines":"154,155"}},{"content":"Persona (70 kg) caminando a 1.5 m/s: Ec = &#xbd;&#xb7;70&#xb7;1.5&#xb2; = 78.75 J &#x2192; poca energ&#xed;a","children":[],"payload":{"tag":"h4","lines":"155,156"}}],"payload":{"tag":"h3","lines":"152,153"}}],"payload":{"tag":"h2","lines":"131,132"}},{"content":"Teorema Trabajo-Energ&#xed;a","children":[{"content":"Enunciado","children":[{"content":"El trabajo neto realizado sobre un objeto es igual al cambio en su energ&#xed;a cin&#xe9;tica","children":[],"payload":{"tag":"h4","lines":"162,163"}},{"content":"W_neto = &#x394;Ec = Ec_f - Ec_i = &#xbd;&#xb7;m&#xb7;v_f&#xb2; - &#xbd;&#xb7;m&#xb7;v_i&#xb2;","children":[],"payload":{"tag":"h4","lines":"163,164"}}],"payload":{"tag":"h3","lines":"161,162"}},{"content":"Demostraci&#xf3;n","children":[{"content":"Partiendo de la Segunda Ley de Newton: F_neta = m&#xb7;a","children":[],"payload":{"tag":"h4","lines":"166,167"}},{"content":"Usando v&#xb2; = v&#x2080;&#xb2; + 2&#xb7;a&#xb7;d &#x2192; a&#xb7;d = (v&#xb2; - v&#x2080;&#xb2;)/2","children":[],"payload":{"tag":"h4","lines":"167,168"}},{"content":"W_neto = F_neta&#xb7;d = m&#xb7;a&#xb7;d = m&#xb7;(v&#xb2; - v&#x2080;&#xb2;)/2 = &#xbd;&#xb7;m&#xb7;v&#xb2; - &#xbd;&#xb7;m&#xb7;v&#x2080;&#xb2; = &#x394;Ec &#x2705;","children":[],"payload":{"tag":"h4","lines":"168,169"}}],"payload":{"tag":"h3","lines":"165,166"}},{"content":"Implicaciones del teorema","children":[{"content":"W_neto &gt; 0 &#x2192; Ec aumenta &#x2192; el objeto se acelera (gana rapidez)","children":[],"payload":{"tag":"h4","lines":"172,173"}},{"content":"W_neto &lt; 0 &#x2192; Ec disminuye &#x2192; el objeto se desacelera (pierde rapidez)","children":[],"payload":{"tag":"h4","lines":"173,174"}},{"content":"W_neto = 0 &#x2192; Ec no cambia &#x2192; la rapidez del objeto no cambia","children":[{"content":"Esto incluye el MCU donde hay fuerza pero la velocidad no cambia en m&#xf3;dulo","children":[],"payload":{"tag":"h5","lines":"175,176"}}],"payload":{"tag":"h4","lines":"174,175"}}],"payload":{"tag":"h3","lines":"170,171"}},{"content":"Aplicaciones del teorema trabajo-energ&#xed;a","children":[{"content":"Encontrar la rapidez de un objeto despu&#xe9;s de que una fuerza act&#xfa;a sobre &#xe9;l","children":[],"payload":{"tag":"h4","lines":"178,179"}},{"content":"Calcular qu&#xe9; distancia recorre un objeto hasta detenerse (con fricci&#xf3;n)","children":[],"payload":{"tag":"h4","lines":"179,180"}},{"content":"Determinar la fuerza promedio en una colisi&#xf3;n","children":[],"payload":{"tag":"h4","lines":"180,181"}},{"content":"Muy &#xfa;til cuando no se conoce el tiempo &#x2192; solo posici&#xf3;n y rapidez","children":[],"payload":{"tag":"h4","lines":"181,182"}}],"payload":{"tag":"h3","lines":"177,178"}},{"content":"Ejemplo &#x2014; Distancia de frenado","children":[{"content":"Auto (1500 kg) a 90 km/h (25 m/s) frena con desaceleraci&#xf3;n por fricci&#xf3;n (&#x3bc;k = 0.7)","children":[],"payload":{"tag":"h4","lines":"184,185"}},{"content":"Ec_i = &#xbd;&#xb7;1500&#xb7;25&#xb2; = 468 750 J","children":[],"payload":{"tag":"h4","lines":"185,186"}},{"content":"W_fricci&#xf3;n = -fk&#xb7;d = -&#x3bc;k&#xb7;m&#xb7;g&#xb7;d = -0.7&#xb7;1500&#xb7;9.8&#xb7;d = -10 290&#xb7;d","children":[],"payload":{"tag":"h4","lines":"186,187"}},{"content":"W_neto = &#x394;Ec &#x2192; -10 290&#xb7;d = 0 - 468 750","children":[],"payload":{"tag":"h4","lines":"187,188"}},{"content":"d = 468 750 / 10 290 &#x2248; 45.6 m","children":[],"payload":{"tag":"h4","lines":"188,189"}}],"payload":{"tag":"h3","lines":"183,184"}}],"payload":{"tag":"h2","lines":"159,160"}},{"content":"Energ&#xed;a Potencial","children":[{"content":"D on fricci&#xf3;n &#x2014; Bloque desliz&#xe1;ndose por rampa","children":[{"content":"Bloque m = 2 kg, rampa h = 3 m, &#x3bc;k = 0.3, longitud de la rampa L = 5 m","children":[],"payload":{"tag":"h4","lines":"353,354"}},{"content":"E_mec_i = m&#xb7;g&#xb7;h = 2&#xb7;9.8&#xb7;3 = 58.8 J (en reposo en la cima)","children":[],"payload":{"tag":"h4","lines":"354,355"}},{"content":"W_fricci&#xf3;n = -&#x3bc;k&#xb7;m&#xb7;g&#xb7;cos(&#x3b8;)&#xb7;L = -0.3&#xb7;2&#xb7;9.8&#xb7;(4/5)&#xb7;5 = -23.52 J","children":[],"payload":{"tag":"h4","lines":"355,356"}},{"content":"E_mec_f = E_mec_i + W_fricci&#xf3;n = 58.8 - 23.52 = 35.28 J","children":[],"payload":{"tag":"h4","lines":"356,357"}},{"content":"&#xbd;&#xb7;m&#xb7;v_f&#xb2; = 35.28 J &#x2192; v_f = &#x221a;(2&#xb7;35.28/2) &#x2248; 5.94 m/s","children":[],"payload":{"tag":"h4","lines":"357,358"}}],"payload":{"tag":"h3","lines":"352,353"}}],"payload":{"tag":"h2","lines":"306,307"}},{"content":"Potencia","children":[{"content":"Definici&#xf3;n","children":[{"content":"Potencia es la tasa a la que se realiza trabajo o se transfiere energ&#xed;a","children":[],"payload":{"tag":"h4","lines":"364,365"}},{"content":"Mide qu&#xe9; tan r&#xe1;pido se hace el trabajo, no cu&#xe1;nto trabajo se hace","children":[],"payload":{"tag":"h4","lines":"365,366"}},{"content":"Dos motores que hacen el mismo trabajo pero en distinto tiempo tienen diferente potencia","children":[],"payload":{"tag":"h4","lines":"366,367"}},{"content":"P = W / t (potencia media)","children":[],"payload":{"tag":"h4","lines":"367,368"}},{"content":"Unidad SI: Watt (W) = Joule/segundo = J/s = kg&#xb7;m&#xb2;/s&#xb3;","children":[],"payload":{"tag":"h4","lines":"368,369"}}],"payload":{"tag":"h3","lines":"363,364"}},{"content":"Potencia media e instant&#xe1;nea","children":[{"content":"Potencia media","children":[{"content":"P_m = W / &#x394;t","children":[],"payload":{"tag":"h5","lines":"373,374"}},{"content":"Trabajo total realizado en el intervalo de tiempo &#x394;t","children":[],"payload":{"tag":"h5","lines":"374,375"}},{"content":"No dice nada sobre las variaciones dentro del intervalo","children":[],"payload":{"tag":"h5","lines":"375,376"}}],"payload":{"tag":"h4","lines":"372,373"}},{"content":"Potencia instant&#xe1;nea","children":[{"content":"P = dW/dt = F &#xb7; (dx/dt) = F &#xb7; v &#xb7; cos(&#x3b8;)","children":[],"payload":{"tag":"h5","lines":"378,379"}},{"content":"P = &#x2192;F &#xb7; &#x2192;v (producto punto de fuerza y velocidad)","children":[],"payload":{"tag":"h5","lines":"379,380"}},{"content":"Cuando la fuerza es paralela a la velocidad: P = F &#xb7; v","children":[],"payload":{"tag":"h5","lines":"380,381"}},{"content":"Unidad SI: Watt (W)","children":[],"payload":{"tag":"h5","lines":"381,382"}}],"payload":{"tag":"h4","lines":"377,378"}}],"payload":{"tag":"h3","lines":"370,371"}},{"content":"Relaci&#xf3;n entre potencia, fuerza y velocidad","children":[{"content":"P = F &#xb7; v (cuando F es paralela a v)","children":[],"payload":{"tag":"h4","lines":"384,385"}},{"content":"A mayor velocidad &#x2192; mayor potencia necesaria para la misma fuerza","children":[],"payload":{"tag":"h4","lines":"385,386"}},{"content":"A mayor potencia disponible &#x2192; mayor velocidad posible con la misma fuerza","children":[],"payload":{"tag":"h4","lines":"386,387"}},{"content":"Un motor m&#xe1;s potente puede hacer el mismo trabajo en menos tiempo","children":[],"payload":{"tag":"h4","lines":"387,388"}},{"content":"O puede mover el mismo objeto m&#xe1;s r&#xe1;pido","children":[],"payload":{"tag":"h4","lines":"388,389"}}],"payload":{"tag":"h3","lines":"383,384"}},{"content":"Unidades de potencia","children":[{"content":"Watt (W) &#x2192; unidad SI","children":[{"content":"1 W = 1 J/s","children":[],"payload":{"tag":"h5","lines":"393,394"}},{"content":"1 kW = 1000 W","children":[],"payload":{"tag":"h5","lines":"394,395"}},{"content":"1 MW = 1 000 000 W","children":[],"payload":{"tag":"h5","lines":"395,396"}}],"payload":{"tag":"h4","lines":"392,393"}},{"content":"Caballo de vapor o Horsepower (HP o CV)","children":[{"content":"1 HP = 746 W (sistema anglosaj&#xf3;n)","children":[],"payload":{"tag":"h5","lines":"398,399"}},{"content":"1 CV (caballo de vapor m&#xe9;trico) = 735.5 W","children":[],"payload":{"tag":"h5","lines":"399,400"}},{"content":"Se usa en motores de autos, robots industriales, bombas","children":[],"payload":{"tag":"h5","lines":"400,401"}}],"payload":{"tag":"h4","lines":"397,398"}},{"content":"Kilowatt-hora (kWh)","children":[{"content":"Es una unidad de ENERG&#xcd;A, no de potencia","children":[],"payload":{"tag":"h5","lines":"403,404"}},{"content":"1 kWh = 1 kW &#xd7; 1 hora = 1000 W &#xd7; 3600 s = 3 600 000 J = 3.6 MJ","children":[],"payload":{"tag":"h5","lines":"404,405"}},{"content":"Es la unidad que usa la compa&#xf1;&#xed;a el&#xe9;ctrica para facturar el consumo","children":[],"payload":{"tag":"h5","lines":"405,406"}}],"payload":{"tag":"h4","lines":"402,403"}}],"payload":{"tag":"h3","lines":"390,391"}},{"content":"Eficiencia energ&#xe9;tica","children":[{"content":"En la realidad ninguna m&#xe1;quina convierte toda la energ&#xed;a de entrada en trabajo &#xfa;til","children":[],"payload":{"tag":"h4","lines":"408,409"}},{"content":"Parte de la energ&#xed;a se pierde en fricci&#xf3;n, calor, sonido, etc.","children":[],"payload":{"tag":"h4","lines":"409,410"}},{"content":"Eficiencia: &#x3b7; = (E_&#xfa;til / E_total) &#xd7; 100%","children":[],"payload":{"tag":"h4","lines":"410,411"}},{"content":"&#x3b7; = (P_salida / P_entrada) &#xd7; 100%","children":[],"payload":{"tag":"h4","lines":"411,412"}},{"content":"&#x3b7; siempre est&#xe1; entre 0% y 100% &#x2192; nunca puede ser mayor del 100%","children":[],"payload":{"tag":"h4","lines":"412,413"}},{"content":"Motor el&#xe9;ctrico t&#xed;pico: &#x3b7; &#x2248; 85-95%","children":[],"payload":{"tag":"h4","lines":"413,414"}},{"content":"Motor de combusti&#xf3;n interna: &#x3b7; &#x2248; 20-40%","children":[],"payload":{"t  &#xb7; d&#x3b8;&#x1d62;","children":[],"payload":{"tag":"h4","lines":"509,510"}},{"content":"Para trayectorias suaves &#x2192; menor trabajo total &#x2192; menor consumo de energ&#xed;a","children":[],"payload":{"tag":"h4","lines":"510,511"}},{"content":"El an&#xe1;lisis de trabajo y energ&#xed;a permite comparar diferentes trayectorias o configuraciones del robot","children":[],"payload":{"tag":"h4","lines":"511,512"}},{"content":"Los algoritmos de planificaci&#xf3;n energ&#xe9;ticamente eficientes buscan minimizar W_total","children":[],"payload":{"tag":"h4","lines":"512,513"}}],"payload":{"tag":"h3","lines":"507,508"}}],"payload":{"tag":"h2","lines":"444,445"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
