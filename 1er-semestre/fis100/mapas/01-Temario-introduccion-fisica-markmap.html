nt":"Puede ser directa (ver, tocar, o&#xed;r) o indirecta (con instrumentos)","children":[],"payload":{"tag":"h5","lines":"235,236"}},{"content":"Ejemplo: observar que una pelota cae m&#xe1;s r&#xe1;pido que una hoja","children":[],"payload":{"tag":"h5","lines":"236,237"}},{"content":"La observaci&#xf3;n debe ser objetiva y reproducible","children":[],"payload":{"tag":"h5","lines":"237,238"}}],"payload":{"tag":"h4","lines":"233,234"}},{"content":"2. Planteamiento del problema","children":[{"content":"Formular una pregunta clara y espec&#xed;fica sobre lo observado","children":[],"payload":{"tag":"h5","lines":"240,241"}},{"content":"La pregunta debe ser medible y verificable experimentalmente","children":[],"payload":{"tag":"h5","lines":"241,242"}},{"content":"Ejemplo: &#xbf;La masa de un objeto afecta su velocidad de ca&#xed;da?","children":[],"payload":{"tag":"h5","lines":"242,243"}},{"content":"Una buena pregunta gu&#xed;a toda la investigaci&#xf3;n","children":[],"payload":{"tag":"h5","lines":"243,244"}}],"payload":{"tag":"h4","lines":"239,240"}},{"content":"3. Hip&#xf3;tesis","children":[{"content":"Propuesta tentativa que responde la pregunta del problema","children":[],"payload":{"tag":"h5","lines":"246,247"}},{"content":"Debe ser clara, espec&#xed;fica y verificable","children":[],"payload":{"tag":"h5","lines":"247,248"}},{"content":"Se formula como una relaci&#xf3;n causa-efecto","children":[],"payload":{"tag":"h5","lines":"248,249"}},{"content":"Ejemplo: &quot;Si la masa no afecta la ca&#xed;da libre, entonces dos objetos de diferente masa caer&#xe1;n a la misma velocidad en ausencia de aire&quot;","children":[],"payload":{"tag":"h5","lines":"249,250"}},{"content":"Tipos de hip&#xf3;tesis","children":[{"content":"Hip&#xf3;tesis nula (H&#x2080;) &#x2192; no hay diferencia o relaci&#xf3;n","children":[],"payload":{"tag":"h6","lines":"251,252"}},{"content":"Hip&#xf3;tesis alternativa (H&#x2081;) &#x2192; s&#xed; hay diferencia o relaci&#xf3;n","children":[],"payload":{"tag":"h6","lines":"252,253"}}],"payload":{"tag":"h5","lines":"250,251"}}],"payload":{"tag":"h4","lines":"245,246"}},{"content":"4. Experimentaci&#xf3;n","children":[{"content":"Dise&#xf1;ar y ejecutar pruebas controladas para probar la hip&#xf3;tesis","children":[],"payload":{"tag":"h5","lines":"255,256"}},{"content":"Variables en un experimento","children":[{"content":"Variable independiente &#x2192; la que el investigador manipula (causa)","children":[],"payload":{"tag":"h6","lines":"257,258"}},{"content":"Variable dependiente &#x2192; la que se mide y cambia (efecto)","children":[],"payload":{"tag":"h6","lines":"258,259"}},{"content":"Variables controladas &#x2192; las que se mantienen constantes","children":[],"payload":{"tag":"h6","lines":"259,260"}}],"payload":{"tag":"h5","lines":"256,257"}},{"content":"El experimento debe ser repetible y reproducible","children":[],"payload":{"tag":"h5","lines":"260,261"}},{"content":"Se registran todos los datos de forma ordenada","children":[],"payload":{"tag":"h5","lines":"261,262"}},{"content":"Ejemplo: dejar caer objetos de distintas masas desde la misma altura y medir el tiempo","children":[],"payload":{"tag":"h5","lines":"262,263"}}],"payload":{"tag":"h4","lines":"254,255"}},{"content":"5. An&#xe1;lisis de resultados","children":[{"content":"Organizar e interpretar los datos obtenidos","children":[],"payload":{"tag":"h5","lines":"265,266"}},{"content":"Usar tablas, gr&#xe1;ficas y estad&#xed;sticas","children":[],"payload":{"tag":"h5","lines":"266,267"}},{"content":"Identificar patrones, tendencias o relaciones entre variables","children":[],"payload":{"tag":"h5","lines":"267,268"}},{"content":"Calcular errores y determinar la confiabilidad de los datos","children":[],"payload":{"tag":"h5","lines":"268,269"}},{"content":"Comparar los resultados con la hip&#xf3;tesis planteada","children":[],"payload":{"tag":"h5","lines":"269,270"}}],"payload":{"tag":"h4","lines":"264,265"}},{"content":"6. Conclusi&#xf3;n","children":[{"content":"Determinar si la hip&#xf3;tesis fue confirmada o refutada","children":[],"payload":{"tag":"h5","lines":"272,273"}},{"content":"Una hip&#xf3;tesis refutada no es un fracaso &#x2192; tambi&#xe9;n es conocimiento","children":[],"payload":{"tag":"h5","lines":"273,274"}},{"content":"Las conclusiones deben basarse SOLO en los datos obtenidos","children":[],"payload":{"tag":"h5","lines":"274,275"}},{"content":"Se sugieren nuevas investigaciones si quedan preguntas abiertas","children":[],"payload":{"tag":"h5","lines":"275,276"}},{"content":"Ejemplo: &quot;Los datos confirman que la masa no afecta la velocidad de ca&#xed;da libre, lo cual es consistente con la teor&#xed;a de Galileo&quot;","children":[],"payload":{"tag":"h5","lines":"276,277"}}],"payload":{"tag":"h4","lines":"271,272"}},{"content":"7. Comunicaci&#xf3;n de resultados","children":[{"content":"Publicar los resultados en informes, art&#xed;culos o presentaciones","children":[],"payload":{"tag":"h5","lines":"279,280"}},{"content":"Permite que otros cient&#xed;ficos verifiquen y repliquen el experimento","children":[],"payload":{"tag":"h5","lines":"280,281"}},{"content":"La revisi&#xf3;n por pares valida la calidad del trabajo","children":[],"payload":{"tag":"h5","lines":"281,282"}},{"content":"El conocimiento cient&#xed;fico es acumulativo y colectivo","children":[],"payload":{"tag":"h5","lines":"282,283"}}],"payload":{"tag":"h4","lines":"278,279"}}],"payload":{"tag":"h3","lines":"231,232"}},{"content":"Ley cient&#xed;fica","children":[{"content":"Descripci&#xf3;n precisa y comprobada de c&#xf3;mo se comporta la naturaleza","children":[],"payload":{"tag":"h4","lines":"285,286"}},{"content":"Se cumple siempre bajo las mismas condiciones","children":[],"payload":{"tag":"h4","lines":"286,287"}},{"content":"Generalmente expresada como una ecuaci&#xf3;n matem&#xe1;tica","children":[],"payload":{"tag":"h4","lines":"287,288"}},{"content":"Ejemplos","children":[{"content":"Ley de la gravitaci&#xf3;n universal: F = G&#xb7;m&#x2081;&#xb7;m&#x2082;/r&#xb2;","children":[],"payload":{"tag":"h5","lines":"289,290"}},{"content":"Segunda Ley de Newton: F = m&#xb7;a","children":[],"payload":{"tag":"h5","lines":"290,291"}},{"content":"Ley de Coulomb: F = k&#xb7;q&#x2081;&#xb7;q&#x2082;/r&#xb2;","children":[],"payload":{"tag":"h5","lines":"291,292"}}],"payload":{"tag":"h4","lines":"288,289"}}],"payload":{"tag":"h3","lines":"284,285"}},{"content":"Teor&#xed;a cient&#xed;fica","children":[{"content":"Explicaci&#xf3;n amplia y bien fundamentada de por qu&#xe9; ocurre un fen&#xf3;meno","children":[],"payload":{"tag":"h4","lines":"294,295"}},{"content":"Est&#xe1; respaldada por m&#xfa;ltiples experimentos y evidencias","children":[],"payload":{"tag":"h4","lines":"295,296"}},{"content":"Puede contener varias leyes relacionadas","children":[],"payload":{"tag":"h4","lines":"296,297"}},{"content":"No es una simple &quot;suposici&#xf3;n&quot; &#x2192; es el nivel m&#xe1;s alto de conocimiento cient&#xed;fico","children":[],"payload":{"tag":"h4","lines":"297,298"}},{"content":"Ejemplos","children":[{"content":"Teor&#xed;a de la relatividad general","children":[],"payload":{"tag":"h5","lines":"299,300"}},{"content":"Teor&#xed;a de la evoluci&#xf3;n","children":[],"payload":{"tag":"h5","lines":"300,301"}},{"content":"Teor&#xed;a cin&#xe9;tico-molecular","children":[],"payload":{"tag":"h5","lines":"301,302"}},{"content":"Teor&#xed;a cu&#xe1;ntica","children":[],"payload":{"tag":"h5","lines":"302,303"}}],"payload":{"tag":"h4","lines":"298,299"}}],"payload":{"tag":"h3","lines":"293,294"}},{"content":"Diferencia entre ley y teor&#xed;a","children":[{"content":"Ley &#x2192; describe QU&#xc9; ocurre (el patr&#xf3;n)","children":[],"payload":{"tag":"h4","lines":"305,306"}},{"content":"Teor&#xed;a &#x2192; explica POR QU&#xc9; ocurre (el mecanismo)","children":[],"payload":{"tag":"h4","lines":"306,307"}},{"content":"Ejemplo: la Ley de Newton describe c&#xf3;mo cae la manzana, la teor&#xed;a de la gravedad explica por qu&#xe9; cae","children":[],"payload":{"tag":"h4","lines":"307,308"}}],"payload":{"tag":"h3","lines":"304,305"}},{"content":"Caracter&#xed;sticas de un buen experimento","children":[{"content":"Controlado &#x2192; solo var&#xed;a una cosa a la vez","children":[],"payload":{"tag":"h4","lines":"310,311"}},{"content":"Reproducible &#x2192; cualquier persona puede repetirlo y obtener el mismo resultado","children":[],"payload":{"tag":"h4","lines":"311,312"}},{"content":"Medible &#x2192; los resultados son cuantitativos","children":[],"payload":{"tag":"h4","lines":"312,313"}},{"content":"Objetivo &#x2192; no influye el sesgo del investigador","children":[],"payload":{"tag":"h4","lines":"313,314"}},{"content":"Tiene grupo control &#x2192; punto de comparaci&#xf3;n sin la variable manipulada","children":[],"payload":{"tag":"h4","lines":"314,315"}}],"payload":{"tag":"h3","lines":"309,310"}},{"content":"Importancia del m&#xe9;todo cient&#xed;fico en ingenier&#xed;a","children":[{"content":"Dise&#xf1;ar y probar componentes rob&#xf3;ticos antes de fabricarlos","children":[],"payload":{"tag":"h4","lines":"317,318"}},{"content":"Encontrar la causa ra&#xed;z de fallas en sistemas rob&#xf3;ticos","children":[],"payload":{"tag":"h4","lines":"318,319"}},{"content":"Optimizar algoritmos de control comparando resultados medidos","children":[],"payload":{"tag":"h4","lines":"319,320"}},{"content":"Validar sensores y actuadores con datos reales","children":[],"payload":{"tag":"h4","lines":"320,321"}},{"content":"Publicar avances en rob&#xf3;tica para la comunidad cient&#xed;fica","children":[],"payload":{"tag":"h4","lines":"321,322"}}],"payload":{"tag":"h3","lines":"316,317"}}],"payload":{"tag":"h2","lines":"223,224"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
