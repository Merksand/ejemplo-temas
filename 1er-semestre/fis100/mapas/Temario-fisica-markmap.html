"La inercia es la resistencia de un objeto a cambiar su estado de movimiento","children":[],"payload":{"tag":"h4","lines":"440,441"}},{"content":"A mayor masa &#x2192; mayor inercia","children":[],"payload":{"tag":"h4","lines":"441,442"}},{"content":"Implicaciones","children":[{"content":"No se necesita fuerza para mantener el movimiento","children":[],"payload":{"tag":"h5","lines":"443,444"}},{"content":"Solo se necesita fuerza para cambiar el movimiento","children":[],"payload":{"tag":"h5","lines":"444,445"}}],"payload":{"tag":"h4","lines":"442,443"}}],"payload":{"tag":"h3","lines":"438,439"}},{"content":"Segunda Ley de Newton &#x2014; F = ma","children":[{"content":"La fuerza neta sobre un cuerpo es igual a su masa por su aceleraci&#xf3;n","children":[],"payload":{"tag":"h4","lines":"447,448"}},{"content":"&#x3a3;F = m&#xb7;a","children":[],"payload":{"tag":"h4","lines":"448,449"}},{"content":"Si hay varias fuerzas, se suman vectorialmente","children":[],"payload":{"tag":"h4","lines":"449,450"}},{"content":"Aplicaciones","children":[{"content":"A mayor fuerza &#x2192; mayor aceleraci&#xf3;n","children":[],"payload":{"tag":"h5","lines":"451,452"}},{"content":"A mayor masa &#x2192; menor aceleraci&#xf3;n (con misma fuerza)","children":[],"payload":{"tag":"h5","lines":"452,453"}}],"payload":{"tag":"h4","lines":"450,451"}},{"content":"Forma vectorial: &#x3a3;F&#x2093; = m&#xb7;a&#x2093; | &#x3a3;F&#x1d67; = m&#xb7;a&#x1d67;","children":[],"payload":{"tag":"h4","lines":"453,454"}}],"payload":{"tag":"h3","lines":"446,447"}},{"content":"Tercera Ley de Newton &#x2014; Acci&#xf3;n y reacci&#xf3;n","children":[{"content":"Para toda fuerza de acci&#xf3;n hay una fuerza de reacci&#xf3;n igual y opuesta","children":[],"payload":{"tag":"h4","lines":"456,457"}},{"content":"F_AB = -F_BA","children":[],"payload":{"tag":"h4","lines":"457,458"}},{"content":"Acci&#xf3;n y reacci&#xf3;n act&#xfa;an sobre cuerpos distintos","children":[],"payload":{"tag":"h4","lines":"458,459"}},{"con ; gravedad","children":[],"payload":{"tag":"h5","lines":"496,497"}},{"content":"En cuerdas &#x2192; tensi&#xf3;n de la cuerda","children":[],"payload":{"tag":"h5","lines":"497,498"}}],"payload":{"tag":"h4","lines":"494,495"}}],"payload":{"tag":"h3","lines":"490,491"}},{"content":"Fuerza centr&#xed;fuga","children":[{"content":"Fuerza ficticia que aparece en sistemas de referencia en rotaci&#xf3;n","children":[],"payload":{"tag":"h4","lines":"500,501"}},{"content":"Tiene el mismo m&#xf3;dulo que la centr&#xed;peta pero sentido contrario (hacia afuera)","children":[],"payload":{"tag":"h4","lines":"501,502"}},{"content":"No existe en un sistema de referencia inercial","children":[],"payload":{"tag":"h4","lines":"502,503"}}],"payload":{"tag":"h3","lines":"499,500"}}],"payload":{"tag":"h2","lines":"431,432"}},{"content":"U6 &#x2014; Trabajo, Energ&#xed;a y Potencia &#x26a1;","children":[{"content":"Concepto de trabajo","children":[{"content":"Transferencia de energ&#xed;a cuando una fuerza produce desplazamiento","children":[],"payload":{"tag":"h4","lines":"509,510"}},{"content":"W = F &#xb7; d &#xb7; cos(&#x3b8;)","children":[],"payload":{"tag":"h4","lines":"510,511"}},{"content":"&#x3b8; es el &#xe1;ngulo entre la fuerza y el desplazamiento","children":[],"payload":{"tag":"h4","lines":"511,512"}},{"content":"Unidad: Joule (J) = N&#xb7;m","children":[],"payload":{"tag":"h4","lines":"512,513"}},{"content":"Trabajo positivo &#x2192; la fuerza ayuda al movimiento","children":[],"payload":{"tag":"h4","lines":"513,514"}},{"content":"Trabajo negativo &#x2192; la fuerza se opone al movimiento","children":[],"payload":{"tag":"h4","lines":"514,515"}},{"content":"Trabajo nulo &#x2192; fuerza perpendicular al desplazamiento (como la normal)","children":[],"payload":{"tag":"h4","lines":"515,516"}}],"payload":{"tag":"h3","lines":"508,509"}},{"content":"Trabajo de una fuerza constante","children":[{"content":"W = F &#xb7; d &#xb7; cos(&#x3b8;)","children":[],"payload":{"tag":"h4","li ando est&#xe1; m&#xe1;s cerca del Sol (perihelio)","children":[],"payload":{"tag":"h5","lines":"768,769"}},{"content":"Se mueve m&#xe1;s lento cuando est&#xe1; m&#xe1;s lejos (afelio)","children":[],"payload":{"tag":"h5","lines":"769,770"}},{"content":"Consecuencia de la conservaci&#xf3;n del momentum angular","children":[],"payload":{"tag":"h5","lines":"770,771"}}],"payload":{"tag":"h4","lines":"766,767"}},{"content":"Tercera Ley &#x2014; Per&#xed;odos y distancias","children":[{"content":"El cuadrado del per&#xed;odo orbital es proporcional al cubo de la distancia media al Sol","children":[],"payload":{"tag":"h5","lines":"773,774"}},{"content":"T&#xb2; = (4&#x3c0;&#xb2;/G&#xb7;M) &#xb7; r&#xb3;","children":[],"payload":{"tag":"h5","lines":"774,775"}},{"content":"T&#xb2; &#x221d; r&#xb3;","children":[],"payload":{"tag":"h5","lines":"775,776"}},{"content":"Permite calcular el per&#xed;odo de cualquier sat&#xe9;lite u orbita conociendo su distancia","children":[],"payload":{"tag":"h5","lines":"776,777"}}],"payload":{"tag":"h4","lines":"772,773"}}],"payload":{"tag":"h3","lines":"759,760"}}],"payload":{"tag":"h2","lines":"709,710"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
