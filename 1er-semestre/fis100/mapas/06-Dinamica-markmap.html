sa con F constante)","children":[],"payload":{"tag":"h4","lines":"74,75"}},{"content":"Si &#x3a3;F = 0 &#x2192; a = 0 &#x2192; v = constante (Primera Ley como caso especial)","children":[],"payload":{"tag":"h4","lines":"75,76"}},{"content":"La aceleraci&#xf3;n siempre apunta en la direcci&#xf3;n de la fuerza neta resultante","children":[],"payload":{"tag":"h4","lines":"76,77"}}],"payload":{"tag":"h3","lines":"72,73"}},{"content":"Unidad de fuerza &#x2014; el Newton","children":[{"content":"De F = ma &#x2192; [F] = kg &#xb7; m/s&#xb2; = Newton (N)","children":[],"payload":{"tag":"h4","lines":"79,80"}},{"content":"1 N es la fuerza necesaria para acelerar 1 kg a 1 m/s&#xb2;","children":[],"payload":{"tag":"h4","lines":"80,81"}},{"content":"Otras unidades de fuerza","children":[{"content":"Dina (CGS): 1 N = 10&#x2075; dinas","children":[],"payload":{"tag":"h5","lines":"82,83"}},{"content":"Kilopond (kp) o kilogramo-fuerza (kgf): 1 kgf = 9.81 N","children":[],"payload":{"tag":"h5","lines":"83,84"}},{"content":"Libra-fuerza (lbf): 1 lbf = 4.448 N","children":[],"payload":{"tag":"h5","lines":"84,85"}}],"payload":{"tag":"h4","lines":"81,82"}}],"payload":{"tag":"h3","lines":"78,79"}},{"content":"Procedimiento general para aplicar la Segunda Ley","children":[{"content":"Paso 1 &#x2192; Identificar el sistema (el cuerpo de inter&#xe9;s)","children":[],"payload":{"tag":"h4","lines":"87,88"}},{"content":"Paso 2 &#x2192; Construir el DCL con todas las fuerzas externas","children":[],"payload":{"tag":"h4","lines":"88,89"}},{"content":"Paso 3 &#x2192; Elegir el sistema de referencia (ejes x e y)","children":[],"payload":{"tag":"h4","lines":"89,90"}},{"content":"Paso 4 &#x2192; Descomponer todas las fuerzas en componentes","children":[],"payload":{"tag":"h4","lines":"90,91"}},{"content":"Paso 5 &#x2192; Plantear &#x3a3;F&#x2093; = m&#xb7;a&#x2093; y &#x3a3;F&#x1d67; = m&#xb7;a&#x1d67;","children":[],"payload":{"tag":"h4","lines":"91,92"}},{"content":"Paso 6 &#x2192; Resolver el sistema de ecuaciones","children":[],"payload":{"tag":"h4","lines":"92,93"}},{"content":"Paso 7 &#x2192; Verificar el resultado (signo, magnitud, sentido f&#xed;sico)","children":[],"payload":{"tag":"h4","lines":"93,94"}}],"payload":{"tag":"h3","lines":"86,87"}},{"content":"Masa vs Peso &#x2014; distinci&#xf3;n importante","children":[{"content":"Masa (m)","children":[{"content":"Cantidad de materia del objeto &#x2192; propiedad intr&#xed;nseca","children":[],"payload":{"tag":"h5","lines":"97,98"}},{"content":"Se mide en kilogramos (kg)","children":[],"payload":{"tag":"h5","lines":"98,99"}},{"content":"No cambia con la ubicaci&#xf3;n","children":[],"payload":{"tag":"h5","lines":"99,100"}},{"content":"Mide la inercia del objeto","children":[],"payload":{"tag":"h5","lines":"100,101"}}],"payload":{"tag":"h4","lines":"96,97"}},{"content":"Peso (W)","children":[{"content":"Fuerza gravitacional sobre el objeto &#x2192; W = m &#xb7; g","children":[],"payload":{"tag":"h5","lines":"102,103"}},{"content":"Se mide en Newtons (N)","children":[],"payload":{"tag":"h5","lines":"103,104"}},{"content":"Cambia con la ubicaci&#xf3;n (depende de g)","children":[],"payload":{"tag":"h5","lines":"104,105"}},{"content":"En la Luna: W_luna = m &#xb7; 1.62 &#x2192; pesa 6 veces menos, pero la masa es la misma","children":[],"payload":{"tag":"h5","lines":"105,106"}}],"payload":{"tag":"h4","lines":"101,102"}}],"payload":{"tag":"h3","lines":"95,96"}}],"payload":{"tag":"h2","lines":"54,55"}},{"content":"Tercera Ley de Newton &#x2014; Acci&#xf3;n y Reacci&#xf3;n","children":[{"content":"Enunciado","children":[{"content":"Para toda fuerza de acci&#xf3;n existe una fuerza de reacci&#xf3;n de igual magnitud, misma direcci&#xf3;n pero sentido contrario","children":[],"payload":{"tag":"h4","lines":"112,113"}},{"content":"F_AB = -F_BA","children":[],"payload":{"tag":"h4","lines":"113,114"}},{"content":"Si el cuerpo A ejerce una fuerza sobre el cuerpo B &#x2192; B ejerce una fuerza igual y opuesta sobre A","children":[],"payload":{"tag":"h4","lines":"114,115"}},{"content":"Las fuerzas de acci&#xf3;n y reacci&#xf3;n SIEMPRE act&#xfa;an sobre cuerpos distintos &#x2192; nunca se cancelan entre s&#xed;","children":[],"payload":{"tag":"h4","lines":"115,116"}}],"payload":{"tag":"h3","lines":"111,112"}},{"content":"Caracter&#xed;sticas del par acci&#xf3;n-reacci&#xf3;n","children":[{"content":"Mismo m&#xf3;dulo &#x2192; |F_AB| = |F_BA|","children":[],"payload":{"tag":"h4","lines":"118,119"}},{"content":"Misma direcci&#xf3;n &#x2192; act&#xfa;an sobre la misma l&#xed;nea de acci&#xf3;n","children":[],"payload":{"tag":"h4","lines":"119,120"}},{"content":"Sentido contrario &#x2192; F_AB = -F_BA","children":[],"payload":{"tag":"h4","lines":"120,121"}},{"content":"Act&#xfa;an sobre cuerpos distintos &#x2192; nunca forman parte del mismo DCL","children":[],"payload":{"tag":"h4","lines":"121,122"}},{"content":"Son simult&#xe1;neas &#x2192; aparecen y desaparecen al mismo tiempo","children":[],"payload":{"tag":"h4","lines":"122,123"}},{"content":"Son del mismo tipo de fuerza &#x2192; si la acci&#xf3;n es gravitacional, la reacci&#xf3;n tambi&#xe9;n","children":[],"payload":{"tag":"h4","lines":"123,124"}}],"payload":{"tag":"h3","lines":"117,118"}},{"content":"Ejemplos de acci&#xf3;n y reacci&#xf3;n","children":[{"content":"Caminar","children":[{"content":"El pie empuja el suelo hacia atr&#xe1;s (acci&#xf3;n)","children":[],"payload":{"tag":"h5","lines":"127,128"}},{"content":"El suelo empuja el pie hacia adelante (reacci&#xf3;n) &#x2192; eso nos hace avanzar","children":[],"payload":{"tag":"h5","lines":"128,129"}}],"payload":{"tag":"h4","lines":"126,127"}},{"content":"Cohete o nave espacial","children":[{"content":"Los gases salen hacia atr&#xe1;s a alta velocidad (acci&#xf3;n)","children":[],"payload":{"tag":"h5","lines":"130,131"}},{"content":"La nave es empujada hacia adelante (reacci&#xf3;n) &#x2192; principio del motor cohete","children":[],"payload":{"tag":"h5","lines":"131,132 ayload":{"tag":"h3","lines":"201,202"}},{"content":"Fricci&#xf3;n en rob&#xf3;tica","children":[{"content":"Los robots de ruedas dependen de la fricci&#xf3;n entre ruedas y suelo para moverse y frenar","children":[],"payload":{"tag":"h4","lines":"210,211"}},{"content":"Las articulaciones de robots tienen fricci&#xf3;n interna &#x2192; reduce eficiencia y precisi&#xf3;n","children":[],"payload":{"tag":"h4","lines":"211,212"}},{"content":"El control de fuerza debe compensar la fricci&#xf3;n en las articulaciones","children":[],"payload":{"tag":"h4","lines":"212,213"}},{"content":"Los lubricantes reducen &#x3bc;k en partes mec&#xe1;nicas &#x2192; mejoran la eficiencia","children":[],"payload":{"tag":"h4","lines":"213,214"}},{"content":"La fricci&#xf3;n en garras y pinzas permite agarrar objetos sin que se resbalen","children":[],"payload":{"tag":"h4","lines":"214,215"}}],"payload":{"tag":"h3","lines":"209,210"}}],"payload":{"tag":"h2","lines":"151,152"}},{"content":"Tensi&#xf3;n en Cuerdas y Poleas","children":[{"content":"Tensi&#xf3;n en cuerdas ideales","children":[{"content":"Cuerda ideal: sin masa, inextensible y sin fricci&#xf3;n","children":[],"payload":{"tag":"h4","lines":"221,222"}},{"content":"La tensi&#xf3;n es igual en cualquier punto de la cuerda &#x2192; T es la misma en toda su longitud","children":[],"payload":{"tag":"h4","lines":"222,223"}},{"content":"La cuerda solo puede jalar, nunca empujar &#x2192; T &gt; 0 siempre","children":[],"payload":{"tag":"h4","lines":"223,224"}},{"content":"Si la cuerda tiene &#xe1;ngulo &#x2192; la tensi&#xf3;n tiene componentes en x e y","children":[],"payload":{"tag":"h4","lines":"224,225"}}],"payload":{"tag":"h3","lines":"220,221"}},{"content":"Sistemas con una cuerda y un bloque","children":[{"content":"El bloque cuelga de una cuerda &#x2192; T = m &#xb7; g (si est&#xe1; en reposo)","children":[],"payload":{"tag":"h4","lines":"227,228"}},{"content":"El bloque sube con aceleraci&#xf3;n a &#x2192; T = m &#xb7; (g + a) &# ":"h4","lines":"242,243"}}],"payload":{"tag":"h3","lines":"232,233"}},{"content":"Poleas","children":[{"content":"Polea fija (simple)","children":[{"content":"Solo cambia la direcci&#xf3;n de la fuerza, no su magnitud","children":[],"payload":{"tag":"h5","lines":"249,250"}},{"content":"La tensi&#xf3;n en la cuerda es la misma en ambos lados","children":[],"payload":{"tag":"h5","lines":"250,251"}},{"content":"No multiplica la fuerza &#x2192; ventaja mec&#xe1;nica = 1","children":[],"payload":{"tag":"h5","lines":"251,252"}},{"content":"Uso: cambiar la direcci&#xf3;n de aplicaci&#xf3;n de la fuerza","children":[],"payload":{"tag":"h5","lines":"252,253"}}],"payload":{"tag":"h4","lines":"248,249"}},{"content":"Polea m&#xf3;vil","children":[{"content":"La carga cuelga de la polea que se mueve","children":[],"payload":{"tag":"h5","lines":"255,256"}},{"content":"Dos tramos de cuerda soportan la carga &#x2192; la tensi&#xf3;n en cada tramo es T = W/2","children":[],"payload":{"tag":"h5","lines":"256,257"}},{"content":"Ventaja mec&#xe1;nica = 2 &#x2192; se necesita la mitad de la fuerza para levantar el peso","children":[],"payload":{"tag":"h5","lines":"257,258"}},{"content":"El precio: hay que jalar el doble de longitud de cuerda","children":[],"payload":{"tag":"h5","lines":"258,259"}}],"payload":{"tag":"h4","lines":"254,255"}},{"content":"Sistema de poleas compuesto (diferencial)","children":[{"content":"Combina poleas fijas y m&#xf3;viles","children":[],"payload":{"tag":"h5","lines":"261,262"}},{"content":"Ventaja mec&#xe1;nica = n&#xfa;mero de tramos de cuerda que soportan la carga","children":[],"payload":{"tag":"h5","lines":"262,263"}},{"content":"Se puede levantar cargas muy pesadas con poca fuerza","children":[],"payload":{"tag":"h5","lines":"263,264"}},{"content":"Usadas en gr&#xfa;as, polipastos y sistemas de cables de robots","children":[],"payload":{"tag":"h5","lines":"264,265"}}],"payload":{"tag":"h4","lines":"260,261"}}],"payload":{"tag":"h3","lines":"246,247"}} t":"Trayectoria circular vertical (como una monta&#xf1;a rusa o pelota en cuerda)","children":[{"content":"En cada punto de la trayectoria la fuerza centr&#xed;peta apunta hacia el centro","children":[],"payload":{"tag":"h5","lines":"361,362"}},{"content":"Las fuerzas que act&#xfa;an son el peso y la tensi&#xf3;n (o normal)","children":[],"payload":{"tag":"h5","lines":"362,363"}}],"payload":{"tag":"h4","lines":"360,361"}},{"content":"En el punto m&#xe1;s bajo del c&#xed;rculo","children":[{"content":"Tanto N (o T) como la fuerza centr&#xed;peta apuntan hacia arriba (al centro)","children":[],"payload":{"tag":"h5","lines":"365,366"}},{"content":"N - m&#xb7;g = m&#xb7;v&#xb2;/r &#x2192; N = m&#xb7;g + m&#xb7;v&#xb2;/r &#x2192; N &gt; W (el objeto se siente m&#xe1;s pesado)","children":[],"payload":{"tag":"h5","lines":"366,367"}}],"payload":{"tag":"h4","lines":"364,365"}},{"content":"En el punto m&#xe1;s alto del c&#xed;rculo","children":[{"content":"Tanto N (o T) como el peso apuntan hacia abajo (al centro)","children":[],"payload":{"tag":"h5","lines":"369,370"}},{"content":"m&#xb7;g + N = m&#xb7;v&#xb2;/r &#x2192; N = m&#xb7;v&#xb2;/r - m&#xb7;g","children":[],"payload":{"tag":"h5","lines":"370,371"}},{"content":"Si v&#xb2;/r &gt; g &#x2192; N &gt; 0 (la superficie empuja hacia abajo &#x2192; necesita estructura encima)","children":[],"payload":{"tag":"h5","lines":"371,372"}},{"content":"Si v&#xb2;/r = g &#x2192; N = 0 (velocidad m&#xed;nima para mantener contacto)","children":[],"payload":{"tag":"h5","lines":"372,373"}},{"content":"Si v&#xb2;/r &lt; g &#x2192; N &lt; 0 &#x2192; imposible &#x2192; el objeto pierde contacto con la superficie","children":[],"payload":{"tag":"h5","lines":"373,374"}}],"payload":{"tag":"h4","lines":"368,369"}},{"content":"Velocidad m&#xed;nima en la cima para mantener contacto","children":[{"content":"N = 0 &#x2192; m&#xb7;g = m&#xb7;v&#xb2;/r &#x2192; v_min = &#x221a;(g&#xb7;r)","children":[],"payload":{"tag":"h5","lines":"376,377"}},{"c children":[],"payload":{"tag":"h5","lines":"494,495"}},{"content":"G(q) &#x2192; vector de torques gravitacionales","children":[],"payload":{"tag":"h5","lines":"495,496"}},{"content":"&#x3c4; &#x2192; vector de torques de los actuadores","children":[],"payload":{"tag":"h5","lines":"496,497"}},{"content":"q, q&#x307;, q&#x308; &#x2192; vectores de posici&#xf3;n, velocidad y aceleraci&#xf3;n articular","children":[],"payload":{"tag":"h5","lines":"497,498"}}],"payload":{"tag":"h4","lines":"491,492"}}],"payload":{"tag":"h3","lines":"489,490"}},{"content":"Din&#xe1;mica directa vs Din&#xe1;mica inversa","children":[{"content":"Din&#xe1;mica directa","children":[{"content":"Dado el vector de torques &#x3c4; &#x2192; calcular la aceleraci&#xf3;n resultante q&#x308;","children":[],"payload":{"tag":"h5","lines":"502,503"}},{"content":"Necesario para simular el comportamiento del robot","children":[],"payload":{"tag":"h5","lines":"503,504"}},{"content":"Se usa en simuladores y en control predictivo","children":[],"payload":{"tag":"h5","lines":"504,505"}}],"payload":{"tag":"h4","lines":"501,502"}},{"content":"Din&#xe1;mica inversa","children":[{"content":"Dada la trayectoria deseada (q, q&#x307;, q&#x308;) &#x2192; calcular los torques necesarios &#x3c4;","children":[],"payload":{"tag":"h5","lines":"507,508"}},{"content":"Es la base del control de par calculado (Computed Torque Control)","children":[],"payload":{"tag":"h5","lines":"508,509"}},{"content":"Permite que el robot siga trayectorias precisas compensando la din&#xe1;mica","children":[],"payload":{"tag":"h5","lines":"509,510"}}],"payload":{"tag":"h4","lines":"506,507"}}],"payload":{"tag":"h3","lines":"499,500"}},{"content":"Efectos din&#xe1;micos importantes en robots","children":[{"content":"Inercia variable","children":[{"content":"El momento de inercia del robot cambia con su configuraci&#xf3;n","children":[],"payload":{"tag":"h5","lines":"514,515"}},{"content":"Un brazo extendido tiene mayor inercia que un brazo recogido","children":[],"payload":{"tag":"h5","lines":"515,516"}},{"content":"El controlador debe adaptarse a estos cambios &#x2192; control adaptativo","children":[],"payload":{"tag":"h5","lines":"516,517"}}],"payload":{"tag":"h4","lines":"513,514"}},{"content":"Fuerzas de Coriolis y centr&#xed;fugas","children":[{"content":"Aparecen cuando el robot se mueve con m&#xfa;ltiples articulaciones simult&#xe1;neamente","children":[],"payload":{"tag":"h5","lines":"519,520"}},{"content":"Generan fuerzas que desv&#xed;an la trayectoria si no se compensan","children":[],"payload":{"tag":"h5","lines":"520,521"}},{"content":"Son proporcionales al cuadrado de la velocidad articular","children":[],"payload":{"tag":"h5","lines":"521,522"}}],"payload":{"tag":"h4","lines":"518,519"}},{"content":"Torques gravitacionales","children":[{"content":"El peso de cada eslab&#xf3;n genera torques que los actuadores deben compensar","children":[],"payload":{"tag":"h5","lines":"524,525"}},{"content":"Mayor cuando el brazo est&#xe1; horizontal &#x2192; menor cuando est&#xe1; vertical","children":[],"payload":{"tag":"h5","lines":"525,526"}},{"content":"Los frenos de estacionamiento evitan que el brazo caiga cuando el motor se apaga","children":[],"payload":{"tag":"h5","lines":"526,527"}}],"payload":{"tag":"h4","lines":"523,524"}}],"payload":{"tag":"h3","lines":"511,512"}},{"content":"Selecci&#xf3;n de motores y reductores","children":[{"content":"El motor debe proveer el torque m&#xe1;ximo requerido por la din&#xe1;mica","children":[],"payload":{"tag":"h4","lines":"529,530"}},{"content":"El reductor (caja de engranajes) multiplica el torque y reduce la velocidad","children":[],"payload":{"tag":"h4","lines":"530,531"}},{"content":"Relaci&#xf3;n de transmisi&#xf3;n n: &#x3c4;_salida = n &#xb7; &#x3c4;_motor, &#x3c9;_salida = &#x3c9;_motor / n","children":[],"payload":{"tag":"h4","lines":"531,532"}},{"content":"Alta reducci&#xf3;n &#x2192; m&#xe1;s torque disponible pero menor velocidad y menor ancho de banda din&#xe1;mico","children":[],"payload":{"tag":"h4","lines":"532,533"}},{"content":"Baja reducci&#xf3;n &#x2192; menos torque pero mayor velocidad y respuesta m&#xe1;s r&#xe1;pida","children":[],"payload":{"tag":"h4","lines":"533,534"}}],"payload":{"tag":"h3","lines":"528,529"}},{"content":"Control PID en din&#xe1;mica de robots","children":[{"content":"Proporcional (P) &#x2192; correcci&#xf3;n proporcional al error de posici&#xf3;n","children":[],"payload":{"tag":"h4","lines":"536,537"}},{"content":"Integral (I) &#x2192; elimina el error estacionario (compensa gravedad en reposo)","children":[],"payload":{"tag":"h4","lines":"537,538"}},{"content":"Derivativo (D) &#x2192; amortigua oscilaciones usando la velocidad del error","children":[],"payload":{"tag":"h4","lines":"538,539"}},{"content":"El ajuste (tuning) del PID debe considerar la din&#xe1;mica del robot &#x2192; masa, inercia, fricci&#xf3;n","children":[],"payload":{"tag":"h4","lines":"539,540"}},{"content":"Para robots r&#xe1;pidos o de alta precisi&#xf3;n &#x2192; el PID simple no es suficiente &#x2192; se necesita control din&#xe1;mico completo","children":[],"payload":{"tag":"h4","lines":"540,541"}}],"payload":{"tag":"h3","lines":"535,536"}}],"payload":{"tag":"h2","lines":"487,488"}}],"payload":{"tag":"h1","lines":"0,1"}},null)</script>
