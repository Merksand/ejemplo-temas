gnifica que a&#x1d9c; = b","children":[],"payload":{"tag":"h4","lines":"291,292"}},{"content":"Ejemplo &#x2192; log&#x2082;(8) = 3 porque 2&#xb3; = 8","children":[],"payload":{"tag":"h4","lines":"292,293"}}],"payload":{"tag":"h3","lines":"290,291"}},{"content":"Logaritmo Natural y Decimal","children":[{"content":"ln(x) = log&#x2091;(x) &#x2192; base e &#x2248; 2.718","children":[],"payload":{"tag":"h4","lines":"294,295"}},{"content":"log(x) = log&#x2081;&#x2080;(x) &#x2192; base 10","children":[],"payload":{"tag":"h4","lines":"295,296"}}],"payload":{"tag":"h3","lines":"293,294"}},{"content":"Propiedades de Logaritmos","children":[{"content":"Producto &#x2192; log(a&#xd7;b) = log(a) + log(b)","children":[],"payload":{"tag":"h4","lines":"297,298"}},{"content":"Divisi&#xf3;n &#x2192; log(a/b) = log(a) - log(b)","children":[],"payload":{"tag":"h4","lines":"298,299"}},{"content":"Potencia &#x2192; log(a&#x207f;) = n &#xd7; log(a)","children":[],"payload":{"tag":"h4","lines":"299,300"}},{"content":"Cambio de base &#x2192; log&#x2090;(b) = log(b)/log(a)","children":[],"payload":{"tag":"h4","lines":"300,301"}},{"content":"Ejemplo &#x2192; log(100) = log(10&#xb2;) = 2&#xd7;log(10) = 2","children":[],"payload":{"tag":"h4","lines":"301,302"}}],"payload":{"tag":"h3","lines":"296,297"}},{"content":"Ecuaciones Exponenciales","children":[{"content":"Misma base &#x2192; a&#x2e3; = a&#x207f; &#x2192; x = n","children":[],"payload":{"tag":"h4","lines":"303,304"}},{"content":"Ejemplo &#x2192; 2&#x2e3; = 8 &#x2192; 2&#x2e3; = 2&#xb3; &#x2192; x = 3","children":[],"payload":{"tag":"h4","lines":"304,305"}},{"content":"Distinta base &#x2192; aplicar logaritmo a ambos lados","children":[],"payload":{"tag":"h4","lines":"305,306"}},{"content":"Ejemplo &#x2192; 3&#x2e3; = 15 &#x2192; x = log(15)/log(3) &#x2248; 2.46","children":[],"payload":{"tag":"h4","lines":"306,307"}}],"payload":{"tag":"h3","lines":"302,303"}},{"content":"Ecuaciones Logar&#xed;tmicas","children":[{"content":"Misma base &#
